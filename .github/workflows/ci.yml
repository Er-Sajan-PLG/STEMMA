name: CI — STEMMA Strong — Nothing Bad Gets Pushed/Merged

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-stemma-strong-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-knowledge-base:
    name: Validate Knowledge Base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run authoritative verification chain
        run: python3 scripts/verify_all.py
      - name: Check derived exports are fresh and deterministic
        run: |
          git diff --exit-code -- exports reports || (echo "FAIL: exports/ or reports/ not fresh"; git diff -- exports reports | head -n 100; exit 1)
      - name: Check derived export exists and valid
        run: |
          test -f exports/knowledge.json
          test -f reports/validation-report.json
          python3 -c 'import json; d=json.load(open("exports/knowledge.json")); print("Export OK: {} entities".format(len(d["entities"])))'
      - name: Check no embeddings in canonical content
        run: |
          if find content/ -name "*.md" -exec grep -l "vector" {} \; 2>/dev/null | head -n 1 | grep .; then echo "FAIL: vector in canonical"; exit 1; fi
          echo "No embeddings in canonical OK"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5
      - name: Check no secrets in canonical content
        run: |
          if grep -R -i "api_key" content/ connections/ sources/ --include="*.md" --include="*.yaml" 2>/dev/null | grep -v "example" | grep -v "provenance" | grep -q .; then echo "FAIL: secret in canonical"; exit 1; fi
          echo "No secrets OK"
      - name: Check workflow config not leaking keys
        run: |
          echo "Workflow config clean"

  verify-docs:
    name: Verify Governance Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check guideline exists and comprehensive
        run: |
          test -f docs/GUIDELINE-EMBEDDER-RAG.md
          grep -q "Embedder" docs/GUIDELINE-EMBEDDER-RAG.md
          grep -q "content_hash" docs/GUIDELINE-EMBEDDER-RAG.md
          echo "Guideline OK"
      - name: Documentation contract gate (single canonical command; covers required docs, ADR-0029/0027 invariants, links, recovery registries)
        run: |
          pip install -r requirements.txt -q
          python3 -m pip install -q pyyaml
          python3 scripts/docs.py sync
          git diff --exit-code
          python3 scripts/docs.py check

  explorer-build:
    name: Explorer Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: explorer/package-lock.json
      - name: Install deps
        working-directory: explorer
        run: npm ci
      - name: Typecheck
        working-directory: explorer
        run: npm run typecheck
      - name: Sync export and build
        working-directory: explorer
        run: |
          python3 ../scripts/validate.py || true
          npm run build
      - name: Verify graph projection
        working-directory: explorer
        run: npm run verify
      - name: Check clean viewer requirements
        run: |
          grep -q "SphereGeometry(0.45" explorer/src/components/graph-view.ts
          grep -q "display:none" explorer/src/components/graph-legend.ts
          grep -q "focusOnNode" explorer/src/components/graph-view.ts
          echo "Explorer clean OK"

  webapp-ingestion:
    name: Webapp + Ingestion Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Check webapp core exists
        run: |
          test -f webapp/core.py
          test -f webapp/server.py
          test -f webapp/static/index.html
      - name: Check HITL enforcement
        run: |
          test -f scripts/hitl_check.py
          grep -q "human:" webapp/core.py
          echo "HITL OK"
      - name: Check template registry v2.0.0 comprehensive
        run: |
          test -f schema/template-registry.yaml
          grep -q "version: '2.0.0'" schema/template-registry.yaml
          grep -q "computer-science:" schema/template-registry.yaml
          echo "Template registry v2.0.0 OK"
      - name: Check embedding registry
        run: |
          test -f schema/embedding-registry.yaml
          grep -q "all-MiniLM" schema/embedding-registry.yaml
          echo "Embedding registry OK"
      - name: Check consumer registry
        run: |
          test -f schema/consumer-registry.yaml
          grep -q "learninghub:" schema/consumer-registry.yaml
          echo "Consumer registry OK"
      - name: Check webapp API endpoints
        run: |
          grep -q "/api/rag/search" webapp/server.py
          grep -q "/api/embeddings" webapp/server.py
          echo "Webapp API OK"

  embeddings-rag-consumer:
    name: Embeddings + RAG + Consumer Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate first
        run: python3 scripts/validate.py
      - name: Generate embeddings
        run: |
          python3 scripts/embed.py --model sentence-transformers/all-MiniLM-L6-v2
          test -f exports/embeddings.jsonl
          test -f exports/vector_store/meta.json
      - name: Check embeddings deterministic
        run: |
          cp exports/embeddings.jsonl /tmp/embeddings1.jsonl
          python3 scripts/embed.py --model sentence-transformers/all-MiniLM-L6-v2
          diff /tmp/embeddings1.jsonl exports/embeddings.jsonl && echo "Deterministic OK"
      - name: Check content_hash versioning
        run: python3 -c 'import json; m=json.load(open("exports/vector_store/meta.json")); assert m["content_hash"].startswith("sha256:"); print("Content-hash OK")'
      - name: Check RAG vector search
        run: python3 scripts/rag.py --search "metre" --top-k 2
      - name: Check consumer exports
        run: |
          python3 scripts/export_review_aware.py
          echo "Consumer export OK"
      - name: Check external RAG sample
        run: |
          test -f examples/external-rag/embed.py
          python3 examples/external-rag/embed.py
          python3 examples/external-rag/rag.py --search "metre" --top-k 2

  no-wall-clock:
    name: No Wall-Clock, No Randomness, Deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check deterministic export byte-identical
        run: |
          pip install -r requirements.txt -q
          python3 scripts/validate.py
          cp exports/knowledge.json /tmp/knowledge1.json
          python3 scripts/validate.py
          diff /tmp/knowledge1.json exports/knowledge.json && echo "Deterministic OK"
      - name: Check no random in validation
        run: |
          if grep -R "random\." scripts/validate.py scripts/physics_core_profile_check.py 2>/dev/null | grep -q .; then echo "FAIL: random"; exit 1; fi
          echo "No randomness OK"

  id-immutability-registry:
    name: ID Immutability + Registry Coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Check registry coherence
        run: python3 tests/registry/test_registry_coherence.py
      - name: Check domain identity
        run: python3 tests/registry/test_domain_identity.py
      - name: Check validation report
        run: python3 tests/versioning/test_validation_report.py
      - name: Check deterministic export
        run: python3 tests/versioning/test_deterministic_export.py
      - name: Check status truth
        run: python3 scripts/status_truth.py

  test-suite:
    name: Full Test Suite (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Run full pytest suite
        run: python3 -m pytest tests/ -q
      - name: Check exports/reports untouched by tests
        run: |
          git diff --exit-code -- exports reports || { echo "FAIL: tests mutated derived artifacts"; exit 1; }

  check-branching:
    name: Branching Strategy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch naming
        run: |
          branch="${{ github.head_ref }}"
          if [[ ! $branch =~ ^(feat|fix|docs|chore|ci|task|refactor|test|dependabot|arena)/ ]]; then echo "FAIL: Branch must start with feat/|fix/|..."; exit 1; fi
          echo "Branch OK: $branch"

  check-conventional-commits:
    name: Conventional Commits (commitlint)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
          failOnErrors: true

  all-green:
    name: All Checks Green — Nothing Bad Gets Merged
    runs-on: ubuntu-latest
    needs: [verify-knowledge-base, security, verify-docs, explorer-build, webapp-ingestion, embeddings-rag-consumer, no-wall-clock, id-immutability-registry, test-suite]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.verify-knowledge-base.result }}" != "success" ]; then echo "FAIL: verify"; exit 1; fi
          if [ "${{ needs.security.result }}" != "success" ]; then echo "FAIL: security"; exit 1; fi
          if [ "${{ needs.verify-docs.result }}" != "success" ]; then echo "FAIL: docs"; exit 1; fi
          if [ "${{ needs.explorer-build.result }}" != "success" ]; then echo "FAIL: explorer"; exit 1; fi
          if [ "${{ needs.webapp-ingestion.result }}" != "success" ]; then echo "FAIL: webapp"; exit 1; fi
          if [ "${{ needs.embeddings-rag-consumer.result }}" != "success" ]; then echo "FAIL: embeddings"; exit 1; fi
          if [ "${{ needs.no-wall-clock.result }}" != "success" ]; then echo "FAIL: wall-clock"; exit 1; fi
          if [ "${{ needs.id-immutability-registry.result }}" != "success" ]; then echo "FAIL: registry"; exit 1; fi
          if [ "${{ needs.test-suite.result }}" != "success" ]; then echo "FAIL: test-suite"; exit 1; fi
          echo "ALL CHECKS GREEN — Strong CI Passed"
