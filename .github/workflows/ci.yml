name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    name: Validate Canonical Knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for id immutability checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -q pyyaml jsonschema

      - name: Validate canonical knowledge
        run: python3 scripts/validate.py

      - name: Verify all
        run: python3 scripts/verify_all.py

      - name: Check derived artifacts committed
        run: |
          if ! git diff --quiet -- exports/knowledge.json reports/validation-report.json; then
            echo "❌ Derived artifacts (exports/, reports/) have uncommitted changes"
            echo "Run 'python3 scripts/validate.py' locally and commit the results"
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -q pyyaml jsonschema pytest

      - name: Run tests
        run: python3 -m pytest tests/ -v

  webapp:
    name: Webapp Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -q pyyaml jsonschema
      - name: Test webapp core
        run: python3 -m pytest tests/webapp/ -v

  explorer:
    name: Explorer Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: explorer/package-lock.json
      - name: Install deps
        working-directory: explorer
        run: npm ci
      - name: Build
        working-directory: explorer
        run: npm run build

  docs:
    name: Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs consistency
        run: python3 -m pytest tests/repo/test_docs_consistency.py -v

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
