on:
  push:
    branches:
      - main

# Uses the built-in GITHUB_TOKEN. This works because the org
# (STEMORG2026) now allows Actions to create and approve pull requests, and
# the repo flag `can_approve_pull_request_reviews` is enabled to match.
#
# History worth keeping: while the ORG policy was restrictive, this job failed
# at the FINAL step -- after release-please had already rewritten
# `release-please--branches--main` -- with:
#   ##[error]release-please failed: GitHub Actions is not permitted to create
#   or approve pull requests.
# The org is the ceiling for that policy; a repo admin cannot loosen it. The
# fix is always at the org level:
#   https://github.com/organizations/STEMORG2026/settings/actions
# (Org Settings -> Actions -> General -> Workflow permissions ->
#  "Allow GitHub Actions to create and approve pull requests").
#
# If this ever regresses to that error, check the org setting FIRST -- a
# fine-grained PAT (RELEASE_PLEASE_TOKEN) is only a workaround for when the
# org policy cannot be changed.
permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
