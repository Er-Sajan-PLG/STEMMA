<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a12" />
    <meta name="description" content="STEMMA — clean minimal 3D knowledge graph, comprehensive all-STEM mediocre 8 domains 97 subdomains 12 entity types 400-800 target, small nodes thin lines, manual legend, centered zoom, embeddings + RAG." />
    <title>STEMMA · Comprehensive All-STEM 3D Graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/explorer.css" />
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <main class="main-layout">
        <section class="graph-container" aria-label="STEMMA 3D Graph">
          <div id="graphCanvas"></div>
          <div id="accessibleList" style="display:none;width:100%;height:100%;"></div>
          <div class="hud-top-left" id="hudStats">
            <span class="hud-dot"></span>
            <span id="hudConceptCount">Concepts</span>
            <span class="hud-divider">•</span>
            <span id="hudEdgeCount">Relations</span>
          </div>
          <div class="hud-bottom-left" id="hudCameraControls">
            <button class="hud-btn" id="btnZoomIn" title="Zoom In">+</button>
            <button class="hud-btn" id="btnZoomOut" title="Zoom Out">−</button>
            <button class="hud-btn" id="btnRecenter" title="Recenter">◎</button>
          </div>
          <div class="hud-bottom-center" id="hudDomainLegend"></div>
          <div id="graphLegend"></div>
          <div id="loadingOverlay" class="overlay-state">
            <div class="spinner"></div>
            <div class="loading-copy">Loading STEMMA comprehensive graph…</div>
            <div class="loading-sub">8 domains · 97 subdomains · 12 entity types · 400-800 target · clean small nodes thin lines · manual legend · centered zoom · embeddings + RAG</div>
          </div>
          <div id="errorOverlay" class="overlay-state" style="display:none;">
            <div class="loading-copy" id="errorMessage">Failed to load</div>
          </div>
        </section>
        <aside class="inspector-container" id="inspector"></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
