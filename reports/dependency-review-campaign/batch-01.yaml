- id: stemma:conn.000253
  claim: Mechanical Advantage mathematically_requires Force
  source: stemma:phys.mechanical-advantage
  relation: mathematically_requires
  target: stemma:phys.force
  source_definition: The factor by which a machine multiplies the input force. Mechanical advantage allows a smaller
    force to produce a larger force, though over a shorter distance.
  target_definition: An influence that can change the motion of a body — that is, accelerate it. In classical mechanics
    the net force on a body equals the rate of change of its momentum. Force is a vector quantity.
  source_equation: MA = F_output / F_input = d_input / d_output
