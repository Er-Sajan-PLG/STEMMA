  source: stemma:phys.equations-of-motion
  relation: mathematically_requires
  target: stemma:phys.velocity
  source_definition: 'The set of kinematic equations relating displacement, initial velocity, uniform acceleration,
    and time for motion in a straight line under constant acceleration: v = u + at, s = ut + ½at², v² = u² + 2as,
    and s = ½(u + v)t. They apply only when acceleration is constant.'
  target_definition: The rate of change of displacement with respect to time. Velocity is a vector quantity — it
    has both magnitude (speed) and direction.
  source_equation: v = u + at;  s = ut + ½at²;  v² = u² + 2as;  s = ½(u+v)t
