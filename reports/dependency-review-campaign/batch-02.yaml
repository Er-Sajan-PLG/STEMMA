    The number of ways to choose r items from n distinct items is C(n, r) = n! / (r! (n − r)!), often written as
    a binomial coefficient (n choose r).
  target_definition: 'The set of whole numbers and their negatives, including zero: ..., -3, -2, -1, 0, 1, 2, 3,
    ... Integers extend natural numbers to include negative values and zero, enabling subtraction to be closed within
    the set.'
  source_equation: C(n, r) = n! / (r! (n − r)!)   (0 ≤ r ≤ n)
  prechecks:
