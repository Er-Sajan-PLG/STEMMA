- id: stemma:conn.000587
  claim: Derivative mathematically_requires Limit
  source: stemma:math.derivative
  relation: mathematically_requires
  target: stemma:math.limit
  source_definition: The instantaneous rate of change of a function with respect to its variable; the limit of the
    average rate of change as the interval shrinks to zero. Written f′(x) = lim_{h→0} (f(x+h) − f(x))/h, the derivative
    gives the slope of the tangent line to the graph at a point.
  target_definition: The value a function or sequence approaches as its input or index approaches a given value.
    Written lim_{x→c} f(x) = L, a limit describes the behaviour of f near the point c without requiring f to be
    defined there. Limits formalize instantaneous change and underpin the derivative and the integral.
  source_equation: f′(x) = lim_{h→0} (f(x+h) − f(x)) / h
  prechecks:
    domain_range: ok
    text_support: name 'Limit'
    has_evidence: false
