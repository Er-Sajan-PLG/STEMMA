  source: stemma:chem.equilibrium-constant
  relation: mathematically_requires
  target: stemma:chem.chemical-equilibrium
  source_definition: A dimensionless quantity that characterizes the position of a chemical equilibrium. For a reaction
    aA + bB ⇌ cC + dD it is the ratio of product concentrations raised to their stoichiometric coefficients to reactant
    concentrations raised to theirs, at a given temperature.
  target_definition: The state of a reversible reaction in which the rates of the forward and reverse reactions
    are equal, so the concentrations of reactants and products remain constant over time. Equilibrium is dynamic
    and does not imply equal quantities of reactants and products.
  source_equation: K = [C]^c [D]^d / ([A]^a [B]^b)
