- id: stemma:phys.conservation-of-energy
  name: Law of Conservation of Energy
  domain: physics
  type: law
  status: draft
  definition: Energy cannot be created or destroyed; it can only be transferred from one object to another or converted
    from one form to another. The total energy of an isolated system remains constant.
  score: 0.023997
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.time
  name: Time
  domain: physics
  type: quantity
  status: draft
  definition: The dimension that orders events from past through present to future, measured as the interval between
    two events. Time is a scalar quantity and one of the fundamental base quantities in physics.
  score: 0.023315
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.acceleration
