- id: stemma:phys.newtons-second-law
  name: Newton's Second Law
  domain: physics
  type: law
  status: draft
  definition: The net force acting on a body equals the rate of change of its momentum; at constant mass this reduces
    to F = m·a.
  score: 0.028393
