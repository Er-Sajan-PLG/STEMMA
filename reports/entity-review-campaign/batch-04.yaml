- id: stemma:math.fundamental-theorem-of-calculus
  name: Fundamental Theorem of Calculus
  domain: mathematics
  type: law
  status: draft
  definition: 'A theorem connecting differentiation and integration. Part 1 states that the derivative of the integral
    of f from a to x is exactly f(x); Part 2 states that a definite integral is evaluated by an antiderivative:
    ∫ₐᵇ f(x) dx = F(b) − F(a) whenever F′ = f. The theorem makes derivatives and integrals inverse operations.'
  score: 0.006515
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.sequence
  name: Sequence
  domain: mathematics
  type: concept
  status: draft
  definition: An ordered list of terms a₁, a₂, a₃, … in which a formula or rule assigns a term to each index n (usually
    a natural number). Sequences are functions whose domain is a set of consecutive integers, and they are classified
    by their patterns into types such as arithmetic and geometric sequences.
  score: 0.006433
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.geometric-sequence
  name: Geometric Sequence
  domain: mathematics
  type: concept
  status: draft
  definition: A sequence in which each term is obtained from the previous one by multiplying by a constant called
    the common ratio r, so aₙ = a₁·rⁿ⁻¹. The terms change by a constant factor, growing exponentially when |r| >
    1 and shrinking toward zero when |r| < 1. The sum of the first n terms is Sₙ = a₁(1 − rⁿ)/(1 − r) for r ≠ 1.
  score: 0.0064
  decision: null
  reviewer: null
  evidence_notes: null
