  name: Newton's Third Law of Motion
  domain: physics
  type: law
  status: draft
  definition: For every action, there is an equal and opposite reaction. When object A exerts a force on object
    B, object B simultaneously exerts a force equal in magnitude and opposite in direction on object A.
