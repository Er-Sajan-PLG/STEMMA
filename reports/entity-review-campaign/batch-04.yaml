- id: stemma:chem.oxidation-reduction
  name: Oxidation-Reduction
  domain: chemistry
  type: concept
  status: draft
  definition: A class of chemical reactions involving the transfer of electrons between species, in which oxidation
    is the loss of electrons and reduction is the gain of electrons. Oxidation and reduction always occur together,
    with one species being oxidized and another reduced.
  score: 0.008704
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.speed
  name: Speed
  domain: physics
  type: quantity
  status: draft
  definition: The rate at which an object covers distance — the total distance traveled divided by the total time
    taken. Speed is a scalar quantity.
  score: 0.008327
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.newtons-law-of-gravitation
  name: Newton's Law of Universal Gravitation
  domain: physics
  type: law
  status: draft
  definition: Every mass attracts every other mass with a force proportional to the product of their masses and
    inversely proportional to the square of the distance between their centers.
  score: 0.008198
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.limit
  name: Limit
  domain: mathematics
  type: concept
  status: draft
  definition: The value a function or sequence approaches as its input or index approaches a given value. Written
    lim_{x→c} f(x) = L, a limit describes the behaviour of f near the point c without requiring f to be defined
    there. Limits formalize instantaneous change and underpin the derivative and the integral.
  score: 0.007837
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.homeostasis
  name: Homeostasis
  domain: biology
  type: concept
  status: draft
  definition: The maintenance of a stable internal environment (temperature, pH, water and solute balance, glucose
    levels) within living organisms despite changes in the external environment, achieved through regulatory feedback
    mechanisms.
  score: 0.007765
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.sound
  name: Sound
  domain: physics
  type: concept
  status: draft
  definition: A mechanical wave produced by vibrating objects, transmitted through a material medium (solid, liquid,
    or gas) as a longitudinal wave. Sound cannot travel through vacuum.
  score: 0.007758
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.natural-selection
  name: Natural Selection
  domain: biology
  type: concept
  status: draft
  definition: The evolutionary process by which organisms possessing heritable traits better suited to their environment
    tend to survive and reproduce at higher rates, passing advantageous alleles to subsequent generations.
  score: 0.007713
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.lens
  name: Lens
  domain: physics
  type: concept
  status: draft
  definition: A transparent optical device that refracts light to converge or diverge rays. Convex (converging)
    lenses bring light to a focus; concave (diverging) lenses spread light apart.
  score: 0.007625
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.chemical-equilibrium
  name: Chemical Equilibrium
  domain: chemistry
  type: concept
  status: draft
  definition: The state of a reversible reaction in which the rates of the forward and reverse reactions are equal,
    so the concentrations of reactants and products remain constant over time. Equilibrium is dynamic and does not
    imply equal quantities of reactants and products.
  score: 0.00762
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.functional-group
  name: Functional Group
  domain: chemistry
  type: concept
  status: draft
  definition: A specific atom or group of atoms within an organic molecule that determines the characteristic chemical
    reactions and properties of that molecule. The same functional group confers predictable behaviour regardless
    of the carbon skeleton to which it is attached.
  score: 0.007608
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.median
  name: Median
  domain: mathematics
  type: quantity
  status: draft
  definition: The middle value in an ordered data set. If there are two middle values, the median is their average.
    It divides the data into two equal halves and is robust against outliers.
  score: 0.00742
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.exponential-function
  name: Exponential Function
  domain: mathematics
  type: concept
  status: draft
  definition: A function of the form f(x) = a·bˣ where the base b is positive and not equal to 1, with x as the
    exponent. The function multiplies by a fixed factor b over each unit interval, producing constant relative growth
    (or decay) rather than constant absolute change.
  score: 0.007394
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.amplitude
  name: Amplitude
  domain: physics
  type: quantity
  status: draft
  definition: The maximum displacement of a wave from its equilibrium (rest) position. Amplitude determines the
    energy carried by the wave — greater amplitude means greater energy.
  score: 0.00737
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.enthalpy
  name: Enthalpy
  domain: chemistry
  type: quantity
  status: draft
  definition: A thermodynamic quantity equal to the internal energy of a system plus the product of its pressure
    and volume, H = U + PV. The change in enthalpy, ΔH, measures the heat absorbed or released by a process at constant
    pressure.
  score: 0.007323
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.gibbs-free-energy
  name: Gibbs Free Energy
  domain: chemistry
  type: quantity
  status: draft
  definition: A thermodynamic quantity, G = H − TS, that combines enthalpy and entropy to predict whether a process
    is spontaneous at constant temperature and pressure. A negative Gibbs free energy change indicates a spontaneous
    process.
  score: 0.007323
  decision: null
  reviewer: null
  evidence_notes: null
