    action of enzymes at an unwound replication fork.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.mutation
  name: Mutation
  domain: biology
  type: concept
  status: draft
  definition: A heritable change in the nucleotide sequence of a genome, arising from errors in DNA replication,
    repair, or recombination, or from environmental mutagens; mutations range from single base changes (point mutations)
