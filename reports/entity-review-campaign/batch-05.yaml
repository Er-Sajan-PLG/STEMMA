- id: stemma:chem.le-chateliers-principle
  name: Le Chatelier's Principle
  domain: chemistry
  type: law
  status: draft
  definition: The principle stating that if a dynamic equilibrium is disturbed by changing a condition such as concentration,
    pressure, or temperature, the equilibrium shifts in the direction that tends to counteract that change and re-establish
    equilibrium.
  score: 0.005495
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.nervous-system
  name: Nervous System
  domain: biology
  type: concept
  status: draft
  definition: The organ system that enables rapid sensing, integration, and response to internal and external stimuli
    through electrical and chemical signalling, comprising the central nervous system (brain and spinal cord) and
    the peripheral nervous system of nerves connecting them to the body.
  score: 0.005239
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.base
  name: Base
  domain: chemistry
  type: concept
  status: draft
  definition: A chemical substance that reacts with acids to form salt and water, accepts protons (H⁺), or releases
    hydroxide ions (OH⁻) in aqueous solution (alkali). Bases taste bitter, feel slippery, turn red litmus paper
    blue, and have a pH greater than 7.
  score: 0.00523
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.nucleus
  name: Nucleus
  domain: biology
  type: concept
  status: draft
  definition: The membrane-bound organelle in eukaryotic cells that contains most of the cell's genetic material
    (DNA) and directs cell activities such as growth, metabolism, and reproduction.
  score: 0.00521
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.integral
  name: Integral
  domain: mathematics
  type: quantity
  status: draft
  definition: 'A quantity that accumulates a function over an interval: the definite integral ∫ₐᵇ f(x) dx measures
    the signed area under the curve y = f(x) between a and b, while the indefinite integral is an antiderivative
    or a family of functions whose derivative is f. Integration reverses differentiation.'
  score: 0.005137
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.arithmetic-sequence
  name: Arithmetic Sequence
  domain: mathematics
  type: concept
  status: draft
  definition: A sequence in which each term differs from the previous one by a constant amount called the common
    difference d, so aₙ = a₁ + (n − 1)d. The terms grow or decrease linearly, and the sum of the first n terms can
    be written compactly as Sₙ = n/2 (a₁ + aₙ).
  score: 0.005093
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.salt
  name: Salt
  domain: chemistry
  type: concept
  status: draft
  definition: An ionic compound formed when the hydrogen ion of an acid is replaced by a metal ion (or ammonium
    ion), typically produced by neutralization of an acid with a base. Common table salt is sodium chloride, NaCl.
  score: 0.005075
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.logarithmic-function
  name: Logarithmic Function
  domain: mathematics
  type: concept
  status: draft
  definition: 'The inverse of the exponential function: y = log_b(x) is the power to which the base b must be raised
    to obtain x, so bʸ = x. Logarithms convert multiplication into addition and satisfy identities such as log_b(xy)
    = log_b(x) + log_b(y).'
  score: 0.004977
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.neutralization
  name: Neutralization Reaction
  domain: chemistry
  type: concept
  status: draft
  definition: A chemical reaction between an acid and a base (or alkali) producing a salt and water, in which hydrogen
    ions (H⁺) from the acid react with hydroxide ions (OH⁻) from the base to form neutral water molecules (H₂O).
  score: 0.004974
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.transcription
  name: Transcription
  domain: biology
  type: concept
  status: draft
  definition: The first stage of gene expression, in which the enzyme RNA polymerase uses one strand of a DNA template
    (the template strand) to synthesize a complementary single-stranded RNA molecule, producing messenger RNA, transfer
    RNA, or ribosomal RNA from a specific gene.
  score: 0.004954
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.determinant
  name: Determinant
  domain: mathematics
  type: quantity
  status: draft
  definition: A scalar value computed from a square matrix that encodes geometric and algebraic properties of the
    matrix, such as whether its linear transformation is invertible. For a 2 × 2 matrix [[a, b], [c, d]] the determinant
    is ad − bc. A zero determinant means the matrix is singular.
  score: 0.004867
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.permutation
  name: Permutation
  domain: mathematics
  type: quantity
  status: draft
  definition: An ordered arrangement of a subset of items drawn from a larger collection, where order matters. The
    number of ways to arrange r items selected from n distinct items is P(n, r) = n! / (n − r)!; arranging all n
    items gives n! possibilities.
  score: 0.004867
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.catalyst
  name: Catalyst
  domain: chemistry
  type: concept
  status: draft
  definition: A substance that increases the rate of a chemical reaction by providing an alternative reaction pathway
    of lower activation energy, while itself being regenerated and not consumed overall. A catalyst does not alter
    the equilibrium position or product yield.
  score: 0.00484
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.animal-cell
  name: Animal Cell
  domain: biology
  type: concept
  status: draft
  definition: A eukaryotic cell characteristic of animals, enclosed by a flexible plasma membrane, lacking a cell
    wall and chloroplasts, and containing membrane-bound organelles such as mitochondria, lysosomes, and a nucleus.
  score: 0.004678
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:earth.water-cycle
  name: Water Cycle
  domain: earth-space
  type: concept
  status: draft
  definition: The continuous circulation of water between the atmosphere, Earth's surface, and underground reservoirs
    through evaporation, transpiration, condensation, precipitation, infiltration, and runoff, driven by solar energy
    and gravity.
  score: 0.00467
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.ray-model
  name: Ray Model of Light
  domain: physics
  type: concept
  status: draft
  definition: A simplified geometric model of light propagation in which light is represented as straight lines
    (rays) traveling through transparent media and changing direction at boundaries via reflection or refraction.
  score: 0.00467
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.mirror
  name: Mirror
  domain: physics
  type: concept
  status: draft
  definition: A surface that reflects light. Plane mirrors produce virtual images of the same size; curved (concave
    and convex) mirrors can produce real or virtual images of varying sizes.
  score: 0.004437
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.oxidation-number
  name: Oxidation Number
  domain: chemistry
  type: quantity
  status: draft
  definition: A bookkeeping number assigned to an atom in a compound or ion that represents the charge the atom
    would have if all bonds to atoms of different electronegativity were ionic. Oxidation numbers track electron
    transfer in oxidation-reduction reactions.
  score: 0.004138
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.alcohol
  name: Alcohol
  domain: chemistry
  type: concept
  status: draft
  definition: An organic compound containing one or more hydroxyl (—OH) functional groups bonded to a saturated
    carbon atom. Alcohols are polar, hydrogen-bonding liquids that range from methanol and ethanol to high-molecular-mass
    polyols.
  score: 0.004011
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.carboxylic-acid
  name: Carboxylic Acid
  domain: chemistry
  type: concept
  status: draft
  definition: An organic compound containing a carboxyl functional group (—COOH), a carbonyl group bonded to a hydroxyl
    group. Carboxylic acids are weak acids that donate a proton from the hydroxyl group to form carboxylate anions.
  score: 0.004011
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.allele
  name: Allele
  domain: biology
  type: concept
  status: draft
  definition: One of the alternative forms of a gene that occupy the same locus on homologous chromosomes and can
    specify alternative versions of a trait; a diploid organism carries two alleles for each autosomal gene, which
    may be identical (homozygous) or different (heterozygous).
  score: 0.003954
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.energy-flow-ecosystem
  name: Energy Flow in Ecosystems
  domain: biology
  type: concept
  status: draft
  definition: The one-way, non-cyclical movement of energy through an ecosystem, entering as sunlight captured by
    producers, passing through successive trophic levels as chemical energy, and being progressively lost to the
    environment as heat through respiration at each transfer.
  score: 0.003954
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.electrochemical-cell
  name: Electrochemical Cell
  domain: chemistry
  type: concept
  status: draft
  definition: A device that converts chemical energy into electrical energy or, conversely, uses electrical energy
    to drive a chemical reaction. Galvanic (voltaic) cells generate electricity from spontaneous redox reactions,
    while electrolytic cells use an external voltage.
  score: 0.003954
  decision: null
  reviewer: null
  evidence_notes: null
