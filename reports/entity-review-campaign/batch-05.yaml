  score: 0.003859
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.dna-replication
  name: DNA Replication
  domain: biology
  type: concept
  status: draft
  definition: The semi-conservative process by which a cell copies its double-stranded DNA before division, in which
