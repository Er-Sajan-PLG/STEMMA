  score: 0.003954
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.alkane
  name: Alkane
  domain: chemistry
  type: concept
  status: draft
  definition: A saturated hydrocarbon in which every carbon atom is bonded to others by single covalent bonds only,
    with the general formula CₙH₂ₙ₊₂ for acyclic alkanes. Alkanes are the simplest homologous series of organic
    compounds.
  score: 0.003905
  decision: null
  reviewer: null
  evidence_notes: null
