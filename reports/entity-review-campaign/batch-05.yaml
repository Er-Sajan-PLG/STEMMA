  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.complex-number
  name: Complex Number
  domain: mathematics
  type: concept
  status: draft
  definition: A number of the form a + bi, where a and b are real and i is the imaginary unit with i² = −1. The
    complex numbers extend the real numbers so that every non-constant polynomial has a root, and are represented
    as points in a plane with a real axis and an imaginary axis.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.continuity
  name: Continuity
  domain: mathematics
  type: concept
  status: draft
  definition: 'A property of a function at a point when the function value equals its limit there: lim_{x→c} f(x)
    = f(c). A function is continuous on an interval if it is continuous at every point of that interval, meaning
    its graph can be drawn without lifting the pen. Continuity is a prerequisite for differentiability and for many
    fundamental results of calculus.'
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:math.standard-deviation
  name: Standard Deviation
  domain: mathematics
  type: quantity
  status: draft
  definition: A measure of dispersion that quantifies how spread out a data set is around its mean. It is the square
    root of the variance; for a set x₁, …, xₙ it equals sqrt((1/n) Σ (xᵢ − μ)²) where μ is the mean. A small standard
    deviation indicates values clustered near the mean, and a large one indicates wide spread.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
