  name: Magnetic Flux
  domain: physics
  type: quantity
  status: draft
  definition: A measure of the total magnetic field passing through a given surface area, calculated as the product
    of magnetic field strength perpendicular to the surface and the surface area.
  score: 0.003954
  decision: null
  reviewer: null
  evidence_notes: null
