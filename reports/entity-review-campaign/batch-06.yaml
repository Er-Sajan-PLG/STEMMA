items:
- id: stemma:phys.graphical-analysis
  name: Graphical Analysis of Motion
  domain: physics
  type: concept
  status: draft
  definition: The use of graphs to represent and analyze motion. Distance-time and velocity-time graphs provide
    visual tools for understanding motion and extracting quantitative information.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.heat-capacity
  name: Heat Capacity
  domain: physics
  type: quantity
  status: draft
  definition: The amount of heat required to raise the temperature of an entire object by one unit of temperature.
    It depends on the object's size and material, unlike the intensive specific heat which is heat capacity per
    unit mass.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.ideal-gas-model
  name: Ideal Gas Model
  domain: physics
  type: concept
  status: draft
  definition: Simplified model of a gas as point particles with no intermolecular forces, obeying PV = nRT. Valid
    at moderate pressure and high temperature.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.mechanical-advantage
  name: Mechanical Advantage
  domain: physics
  type: concept
  status: draft
  definition: The factor by which a machine multiplies the input force. Mechanical advantage allows a smaller force
    to produce a larger force, though over a shorter distance.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.nuclear-binding-energy
  name: Nuclear Binding Energy
  domain: physics
  type: quantity
  status: draft
  definition: The energy required to separate a nucleus into its individual nucleons, equivalent to the mass defect
    through the mass-energy relation. It reflects the energy released when a nucleus forms from its constituents.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.phase-change
  name: Phase Change
  domain: physics
  type: concept
  status: draft
  definition: A transition of matter between solid, liquid, and gas states in which the identity of the substance
    is preserved while its internal structure changes. Latent heat is absorbed or released at constant temperature
    during such a transition.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.projectile-motion
  name: Projectile Motion
  domain: physics
  type: concept
  status: draft
  definition: The motion of an object thrown or launched into the air, moving under the influence of gravity alone
    (neglecting air resistance). The horizontal and vertical components of motion are independent.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.simple-harmonic-motion
  name: Simple Harmonic Motion
  domain: physics
  type: concept
  status: draft
  definition: Motion in which the restoring force on an object is directly proportional to its displacement from
    equilibrium and opposite in direction, producing a sinusoidal variation of displacement with time.
  score: 0.00367
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.adaptation
  name: Adaptation
  domain: biology
  type: concept
  status: draft
  definition: A heritable characteristic, structure, behaviour, or physiological trait that enhances an organism's
    ability to survive and reproduce in its environment, having arisen through natural selection acting on genetic
    variation over generations.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.food-chain
  name: Food Chain
  domain: biology
  type: concept
  status: draft
  definition: A linear sequence of organisms within an ecosystem along which energy and nutrients are transferred
    as one organism is consumed by the next, beginning typically with a producer and passing through consumers of
    successive trophic levels.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.glycolysis
  name: Glycolysis
  domain: biology
  type: concept
  status: draft
  definition: The first stage of cellular respiration, a ten-step cytosolic pathway that breaks down one molecule
    of glucose into two molecules of pyruvate, producing a net yield of two ATP and two NADH without requiring oxygen,
    and providing substrates for further aerobic or anaerobic reactions.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.hormone
  name: Hormone
  domain: biology
  type: concept
  status: draft
  definition: A chemical messenger secreted by endocrine glands or specialized cells into the bloodstream or extracellular
    fluid that travels to target cells expressing specific receptors, where it triggers physiological responses,
    helping to regulate metabolism, growth, reproduction, and homeostasis.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.immune-system
  name: Immune System
  domain: biology
  type: concept
  status: draft
  definition: The coordinated network of organs, cells, and molecules that defends the body against pathogens and
    other foreign substances, comprising nonspecific (innate) mechanisms such as barriers and phagocytes and specific
    (adaptive) responses including antibody production and immunological memory.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.inheritance-patterns
  name: Inheritance Patterns
  domain: biology
  type: concept
  status: draft
  definition: The recurring ways in which traits and alleles are transmitted from parents to offspring, including
    Mendelian patterns (dominant, recessive, codominant, and incomplete dominance) and non-Mendelian patterns such
    as sex linkage, multiple alleles, polygenic inheritance, and pleiotropy.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.meiosis
  name: Meiosis
  domain: biology
  type: concept
  status: draft
  definition: A specialized two-stage cell division (meiosis I and meiosis II) in diploid organisms that produces
    four genetically distinct haploid gametes or spores, halving the chromosome number and generating genetic variation
    through crossing over and independent assortment.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.mitosis
  name: Mitosis
  domain: biology
  type: concept
  status: draft
  definition: The stage of the cell cycle in which a eukaryotic cell's nucleus divides, its duplicated chromosomes
    separating into two genetically identical daughter nuclei, so that each daughter cell receives the same diploid
    chromosome complement as the parent.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.neuron
  name: Neuron
  domain: biology
  type: concept
  status: draft
  definition: The electrically excitable nerve cell that is the fundamental signalling unit of the nervous system,
    composed of dendrites receiving signals, a cell body integrating them, and an axon conducting action potentials
    that release neurotransmitters at synapses to transmit information to other cells.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.population-dynamics
  name: Population Dynamics
  domain: biology
  type: concept
  status: draft
  definition: The study of how population size, density, age structure, and distribution change over time and space
    in response to birth, death, immigration, and emigration, modulated by resource availability, competition, predation,
    and other density-dependent and density-independent factors.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.speciation
  name: Speciation
  domain: biology
  type: concept
  status: draft
  definition: The evolutionary process by which populations diverge genetically to the point that they become reproductively
    isolated from one another, forming distinct species; it commonly proceeds through allopatric (geographic separation)
    or sympatric (within a shared range) mechanisms.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:bio.translation
  name: Translation
  domain: biology
  type: concept
  status: draft
  definition: The process in which the nucleotide sequence of messenger RNA is decoded by ribosomes to assemble
    a polypeptide chain, with transfer RNA molecules matching successive codons to their corresponding amino acids
    and linking them into proteins.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.electrolysis
  name: Electrolysis
  domain: chemistry
  type: concept
  status: draft
  definition: The decomposition of a compound into its elements or simpler substances by passing an electric current
    through an electrolyte. Electrolysis is driven by an external voltage and is the key process in an electrolytic
    cell, enabling nonspontaneous redox reactions.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.isomer
  name: Isomer
  domain: chemistry
  type: concept
  status: draft
  definition: One of two or more compounds that have the same molecular formula but different arrangements of atoms,
    and therefore different structures or spatial configurations. Isomerism may be structural (constitutional) or
    stereochemical.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.periodic-table
  name: Periodic Table of Elements
  domain: chemistry
  type: concept
  status: draft
  definition: A tabular arrangement of chemical elements ordered by increasing atomic number, displaying recurring
    (periodic) trends in chemical and physical properties across periods (rows) and groups (columns).
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.ph-scale
  name: pH Scale
  domain: chemistry
  type: concept
  status: draft
  definition: A logarithmic scale measuring the acidity or alkalinity of an aqueous solution, defined as the negative
    base-10 logarithm of the hydrogen ion concentration (pH = -log₁₀[H⁺]), ranging from 0 (highly acidic) to 14
    (highly alkaline), with 7 being neutral.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:earth.big-bang-theory
  name: Big Bang Theory
  domain: earth-space
  type: concept
  status: draft
  definition: The prevailing cosmological model describing the early development and metric expansion of the universe
    from an extremely hot, dense state approximately 13.8 billion years ago.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.brownian-motion
  name: Brownian Motion
  domain: physics
  type: concept
  status: draft
  definition: Random, erratic motion of microscopic particles suspended in a fluid, caused by collisions with fast-moving
    molecules of the fluid. Evidence for molecular-kinetic theory.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.capacitor
  name: Capacitance
  domain: physics
  type: quantity
  status: draft
  definition: The ability of a system of conductors separated by an insulator to store electric charge, measured
    as the ratio of stored charge to the potential difference across the system. A capacitor is the device realizing
    this property.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.doppler-effect
  name: Doppler Effect
  domain: physics
  type: concept
  status: draft
  definition: The apparent change in the observed frequency of a wave due to relative motion between the wave source
    and the observer. The observed frequency is higher as the source approaches and lower as it recedes.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.electric-field
  name: Electric Field
  domain: physics
  type: quantity
  status: draft
  definition: The region of space surrounding a charge in which another charge experiences a force; quantified as
    the electric force per unit positive test charge at a point.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.electromagnetic-wave
  name: Electromagnetic Wave
  domain: physics
  type: concept
  status: draft
  definition: A transverse self-propagating disturbance of perpendicular electric and magnetic fields that travels
    through space at the speed of light, requiring no material medium. The electromagnetic spectrum orders such
    waves by frequency and wavelength.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.generator
  name: Electric Generator
  domain: physics
  type: concept
  status: draft
  definition: A machine that converts mechanical energy into electrical energy using electromagnetic induction,
    forcing electric charge to flow through an external circuit by rotating a coil in a magnetic field.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.magnetic-force
  name: Magnetic Force
  domain: physics
  type: quantity
  status: draft
  definition: The force exerted by a magnetic field on a moving charge or on a current-carrying conductor. It is
    perpendicular to both the velocity of the charge and the magnetic field, so it changes the direction of motion
    but not the speed of a free charge.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.quantized-energy-levels
  name: Quantized Energy Levels
  domain: physics
  type: concept
  status: draft
  definition: The discrete set of energies that a bound system, such as an atom, may possess. Transitions between
    levels involve the absorption or emission of a photon whose energy equals the difference between the two levels.
  score: 0.00267
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:chem.polymer
  name: Polymer
  domain: chemistry
  type: concept
  status: draft
  definition: A large molecule built from many repeating monomer units joined by covalent bonds. Polymers may be
    natural, such as proteins and cellulose, or synthetic, such as polyethylene and nylon, formed by addition or
    condensation polymerization.
  score: 0.00167
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.half-life
  name: Half-Life
  domain: physics
  type: quantity
  status: draft
  definition: The time required for half the nuclei in a radioactive sample to decay. It is a statistically defined
    constant for a given nuclide and independent of the sample size.
  score: 0.00167
  decision: null
  reviewer: null
  evidence_notes: null
- id: stemma:phys.wave-interference
  name: Wave Interference
  domain: physics
  type: concept
  status: draft
  definition: The superposition of two or more waves at a point resulting in a combined disturbance whose amplitude
    is the sum of the individual amplitudes. Constructive interference occurs when waves are in phase and destructive
    interference when they are out of phase.
  score: 0.00167
  decision: null
  reviewer: null
  evidence_notes: null
