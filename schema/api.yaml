openapi: 3.0.3
info:
  title: STEMMA read-only consumer API (adapter /v2)
  version: 2.3.0
  description: |
    Read-only HTTP view over one STEMMA export, served by the Python adapter
    (`adapters/python/stemma_adapter`). Scope and status are fixed by ADR-0054:

    - The **file contract** (`exports/knowledge.json` + `content_hash`) is the
      primary consumer contract; this HTTP API is an optional convenience that a
      consumer runs locally (default bind 127.0.0.1).
    - No auth and no rate limiting; there is no hosted production endpoint in
      this phase.
    - Paths marked `x-stability: experimental` (embeddings, RAG, consumer
      export) are reference/demo implementations. Unless `sentence-transformers`
      is installed they run on deterministic placeholder vectors; production
      embedding/RAG is the consumer's job (ARCHITECTURE-V2 §5.1–5.2).
    - The webapp's `/api/*` routes are the private curation tool and are NOT
      part of this API.

    `tests/repo/test_api_spec_matches_server.py` keeps this file in sync with
    the routes the adapter actually serves.

  contact:
    name: STEMMA
    url: https://github.com/Er-Sajan-PLG/STEMMA
  license:
    name: CC BY 4.0 for content, MIT for code

servers:
  - url: http://127.0.0.1:8080
    description: Local adapter (PYTHONPATH=adapters/python python3 -m stemma_adapter serve exports/knowledge.json --port 8080)

paths:
  /v2/stats:
    get:
      summary: Get stats
      description: Returns entity/connection/source counts, content_hash, versions
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /v2/entities:
    get:
      summary: List entities
      parameters:
        - name: domain
          in: query
          schema:
            type: string
            enum: [physics, chemistry, biology, earth-science, astronomy, computer-science, engineering, mathematics]
          description: Filter by domain
        - name: subdomain
          in: query
          schema:
            type: string
          description: Filter by subdomain (e.g., mechanics, organic, cell-biology, algorithms)
        - name: type
          in: query
          schema:
            type: string
            enum: [concept, quantity, unit, constant, law, principle, theorem, equation, process, structure, algorithm, material]
          description: Filter by entity type
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, human_reviewed, canonical]
          description: Filter by status
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'

  /v2/entities/{id}:
    get:
      summary: Get entity by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: stemma:phys.metre
      responses:
        '200':
          description: Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'

  /v2/connections:
    get:
      summary: List connections (first-class relationship assertions)
      parameters:
        - name: source
          in: query
          schema:
            type: string
          description: Source entity ID
        - name: target
          in: query
          schema:
            type: string
          description: Target entity ID
        - name: relation
          in: query
          schema:
            type: string
            enum: [mathematically_requires, derived_from, appears_in_law, applies_to, generalizes, special_case_of, part_of, approximates]
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'

  /v2/search:
    get:
      summary: Search entities
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Query string
          example: force
        - name: domain
          in: query
          schema:
            type: string
          description: Domain filter
        - name: type
          in: query
          schema:
            type: string
          description: Type filter
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'

  /v2/neighbors/{id}:
    get:
      summary: Get neighbors of entity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Neighbors

  /v2/prerequisites/{id}:
    get:
      summary: Get prerequisite closure
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: policy
          in: query
          schema:
            type: string
            enum: [all, canonical, reviewed, trusted]
            default: canonical
      responses:
        '200':
          description: Prerequisites

  /v2/values/{id}:
    get:
      summary: Get valued claims for an entity (ADR-0045 value-slot)
      description: >-
        Connections whose object is a structured value ({amount, lowerBound,
        upperBound, unit}) rather than a target entity. These never appear in
        /v2/neighbors or /v2/prerequisites.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: relation
          in: query
          schema:
            type: string
        - name: policy
          in: query
          schema:
            type: string
            enum: [all, canonical, reviewed, trusted]
      responses:
        '200':
          description: Valued claims sorted by connection id
        '404':
          description: Unknown entity id

  /v2/relations:
    get:
      summary: Get relation registry
      responses:
        '200':
          description: Relation registry

  /v2/relations/{name}:
    get:
      summary: Get one relation definition
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Relation definition (family, direction, inverse, ...)
        '400':
          description: Unknown relation

  /v2/resolve/{id}:
    get:
      summary: Resolve an id through alias / deprecation chains
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "{resolved, chain}"
        '404':
          description: Unknown entity id

  /v2/external/{scheme}/{value}:
    get:
      summary: Look up an entity by external identifier (e.g. wd/Q14038)
      parameters:
        - name: scheme
          in: path
          required: true
          schema:
            type: string
        - name: value
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity
        '404':
          description: No entity carries that external id

  /v2/vocabularies:
    get:
      summary: Controlled vocabularies (domains, entity types, statuses, ...)
      responses:
        '200':
          description: Vocabularies

  /openapi.yaml:
    get:
      summary: This OpenAPI document (also served at /v2/openapi.yaml)
      responses:
        '200':
          description: OpenAPI YAML

  /v2/openapi.yaml:
    get:
      summary: Alias of /openapi.yaml
      responses:
        '200':
          description: OpenAPI YAML

  /v2/embeddings:
    get:
      x-stability: experimental
      summary: Get embeddings for entities
      description: Returns embeddings for entities, with model selection like DeepSeek harness (local free BGE, All-MiniLM + frontier OpenAI, Cohere, Gemini, NVIDIA)
      parameters:
        - name: model
          in: query
          schema:
            type: string
            default: sentence-transformers/all-MiniLM-L6-v2
          description: Embedding model ID from embedding-registry.yaml
          example: BAAI/bge-large-en-v1.5
        - name: id
          in: query
          schema:
            type: string
          description: Entity ID to get embedding for
        - name: domain
          in: query
          schema:
            type: string
          description: Domain filter
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Embeddings
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
                  dimensions:
                    type: integer
                  embeddings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Embedding'

  /v2/rag/search:
    get:
      x-stability: experimental
      summary: Vector search for RAG
      description: Embedding-based similarity search over entities for RAG
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Query to embed and search
          example: What is Newton's second law?
        - name: model
          in: query
          schema:
            type: string
            default: sentence-transformers/all-MiniLM-L6-v2
          description: Embedding model ID
        - name: top_k
          in: query
          schema:
            type: integer
            default: 5
          description: Top K results
        - name: domain
          in: query
          schema:
            type: string
          description: Domain filter
      responses:
        '200':
          description: Search results with scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RAGResult'

  /v2/rag/query:
    post:
      x-stability: experimental
      summary: RAG query — retrieval-augmented generation
      description: |
        RAG query: embed question, retrieve top_k entities, build context with definitions + connections + sources, call LLM with model selector like DeepSeek harness (local + frontier models) (DeepSeek R1, Claude 3.5 Sonnet, GPT-4o, Gemini 2.5 Pro, Llama 3.3, custom) to generate answer with citations.
        Supports consumer-specific models: LearningHub prefers GPT-4o, PROFESSOR-J prefers DeepSeek R1 free.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  example: What is Newton's second law?
                top_k:
                  type: integer
                  default: 5
                domain:
                  type: string
                  description: Domain filter for retrieval
                model:
                  type: string
                  default: deepseek/deepseek-r1:free
                  description: LLM model ID for generation, from frontier model catalog (DeepSeek R1, Claude 3.5 Sonnet, GPT-4o, Gemini 2.5 Pro, Llama 3.3, custom)
                  example: deepseek/deepseek-r1:free
                embedding_model:
                  type: string
                  default: sentence-transformers/all-MiniLM-L6-v2
                  description: Embedding model for retrieval
                consumer:
                  type: string
                  enum: [learninghub, professor-j, general]
                  default: general
                  description: Consumer for tailored response
      responses:
        '200':
          description: RAG answer with citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAGAnswer'

  /v2/export:
    get:
      x-stability: experimental
      summary: Export for specific consumer
      description: Export filtered knowledge for consumer like LearningHub, PROFESSOR-J
      parameters:
        - name: consumer
          in: query
          required: true
          schema:
            type: string
            enum: [learninghub, professor-j, general, stemma-explorer]
          description: Consumer ID from consumer-registry.yaml
        - name: format
          in: query
          schema:
            type: string
            enum: [json, jsonl, embeddings, vector_store]
            default: json
          description: Export format
        - name: review_policy
          in: query
          schema:
            type: string
            enum: [all, canonical, reviewed, trusted]
            default: canonical
      responses:
        '200':
          description: Export

components:
  schemas:
    Stats:
      type: object
      properties:
        entity_count:
          type: integer
        connection_count:
          type: integer
        source_count:
          type: integer
        content_hash:
          type: string
        export_version:
          type: string
        schema_version:
          type: string

    Entity:
      type: object
      properties:
        id:
          type: string
          example: stemma:phys.metre
        type:
          type: string
          enum: [concept, quantity, unit, constant, law, principle, theorem, equation, process, structure, algorithm, material]
        name:
          type: string
        domain:
          type: string
          enum: [physics, chemistry, biology, earth-science, astronomy, computer-science, engineering, mathematics]
        subdomain:
          type: string
        definition:
          type: string
        status:
          type: string
        provenance:
          type: object
        source_refs:
          type: array
          items:
            type: string
        external_ids:
          type: object

    Connection:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        relation:
          type: string
        evidence:
          type: array

    Embedding:
      type: object
      properties:
        entity_id:
          type: string
        model:
          type: string
        dimensions:
          type: integer
        vector:
          type: array
          items:
            type: number
        content_hash:
          type: string

    RAGResult:
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/Entity'
        score:
          type: number
          description: Cosine similarity score
        content:
          type: string
          description: Chunk used for retrieval

    RAGAnswer:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        citations:
          type: array
          items:
            type: object
            properties:
              entity_id:
                type: string
              source_ref:
                type: string
              link:
                type: string
        retrieved_entities:
          type: array
          items:
            $ref: '#/components/schemas/RAGResult'
        model_used:
          type: string
        embedding_model_used:
          type: string
        content_hash:
          type: string
