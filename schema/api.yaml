openapi: 3.0.3
info:
  title: STEMMA API — Comprehensive All-STEM Knowledge Foundation with RAG and Embeddings
  version: 2.1.0
  description: |
    STEMMA API for consumers like LearningHub, PROFESSOR-J, and general consumers.
    Provides entities, connections, search, embeddings, RAG query, and export for specific consumers.

    **Domains:** physics, chemistry, biology, earth-science, astronomy, computer-science, engineering, mathematics — comprehensive mediocre coverage, not minimal physics.

    **Features:**
    - Deterministic exports with content-hash, no wall clock, versioned
    - Embeddings with model selector like DeepSeek harness (local + frontier models) (local free BGE, All-MiniLM + frontier OpenAI text-embedding-3-large, Cohere, Gemini, NVIDIA NV-Embed)
    - RAG system: retrieval-augmented generation using vector store (FAISS/Chroma) + frontier LLM selector (DeepSeek R1, Claude 3.5 Sonnet, GPT-4o, Gemini 2.5 Pro, Llama 3.3, custom)
    - Consumer-specific exports: LearningHub (canonical physics/chem/bio/math, high-quality embeddings), PROFESSOR-J (all domains reviewed, offline SOTA embeddings, RAG), general
    - HITL enforced: all entities have human:writer and audit trail

    **Base URL:** /v2 for adapter server (adapters/python), /api for webapp server

    **Auth:** None for local, api_key for LearningHub/PROFESSOR-J, bearer for frontier models via OpenRouter

  contact:
    name: STEMMA
    url: https://github.com/Er-Sajan-PLG/STEMMA
  license:
    name: CC BY 4.0 for content, MIT for code

servers:
  - url: http://localhost:8080
    description: Adapter Python local JSON API (PYTHONPATH=adapters/python python3 -m stemma_adapter serve exports/knowledge.json --port 8080)
  - url: http://localhost:8081
    description: Webapp ingestion/review UI + RAG (python3 webapp/server.py --port 8081)
  - url: https://api.stemma.example.com/v2
    description: Production (future)

paths:
  /v2/stats:
    get:
      summary: Get stats
      description: Returns entity/connection/source counts, content_hash, versions
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /v2/entities:
    get:
      summary: List entities
      parameters:
        - name: domain
          in: query
          schema:
            type: string
            enum: [physics, chemistry, biology, earth-science, astronomy, computer-science, engineering, mathematics]
          description: Filter by domain
        - name: subdomain
          in: query
          schema:
            type: string
          description: Filter by subdomain (e.g., mechanics, organic, cell-biology, algorithms)
        - name: type
          in: query
          schema:
            type: string
            enum: [concept, quantity, unit, constant, law, principle, theorem, equation, process, structure, algorithm, material]
          description: Filter by entity type
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, human_reviewed, canonical]
          description: Filter by status
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'

  /v2/entities/{id}:
    get:
      summary: Get entity by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: stemma:phys.metre
      responses:
        '200':
          description: Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'

  /v2/connections:
    get:
      summary: List connections (first-class relationship assertions)
      parameters:
        - name: source
          in: query
          schema:
            type: string
          description: Source entity ID
        - name: target
          in: query
          schema:
            type: string
          description: Target entity ID
        - name: relation
          in: query
          schema:
            type: string
            enum: [mathematically_requires, derived_from, appears_in_law, applies_to, generalizes, special_case_of, part_of, approximates]
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'

  /v2/search:
    get:
      summary: Search entities
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Query string
          example: force
        - name: domain
          in: query
          schema:
            type: string
          description: Domain filter
        - name: type
          in: query
          schema:
            type: string
          description: Type filter
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'

  /v2/neighbors/{id}:
    get:
      summary: Get neighbors of entity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Neighbors

  /v2/prerequisites/{id}:
    get:
      summary: Get prerequisite closure
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: policy
          in: query
          schema:
            type: string
            enum: [all, canonical, reviewed, trusted]
            default: canonical
      responses:
        '200':
          description: Prerequisites

  /v2/relations:
    get:
      summary: Get relation registry
      responses:
        '200':
          description: Relation registry

  /v2/embeddings:
    get:
      summary: Get embeddings for entities
      description: Returns embeddings for entities, with model selection like DeepSeek harness (local free BGE, All-MiniLM + frontier OpenAI, Cohere, Gemini, NVIDIA)
      parameters:
        - name: model
          in: query
          schema:
            type: string
            default: sentence-transformers/all-MiniLM-L6-v2
          description: Embedding model ID from embedding-registry.yaml
          example: BAAI/bge-large-en-v1.5
        - name: id
          in: query
          schema:
            type: string
          description: Entity ID to get embedding for
        - name: domain
          in: query
          schema:
            type: string
          description: Domain filter
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Embeddings
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
                  dimensions:
                    type: integer
                  embeddings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Embedding'

  /v2/rag/search:
    get:
      summary: Vector search for RAG
      description: Embedding-based similarity search over entities for RAG
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Query to embed and search
          example: What is Newton's second law?
        - name: model
          in: query
          schema:
            type: string
            default: sentence-transformers/all-MiniLM-L6-v2
          description: Embedding model ID
        - name: top_k
          in: query
          schema:
            type: integer
            default: 5
          description: Top K results
        - name: domain
          in: query
          schema:
            type: string
          description: Domain filter
      responses:
        '200':
          description: Search results with scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RAGResult'

  /v2/rag/query:
    post:
      summary: RAG query — retrieval-augmented generation
      description: |
        RAG query: embed question, retrieve top_k entities, build context with definitions + connections + sources, call LLM with model selector like DeepSeek harness (local + frontier models) (DeepSeek R1, Claude 3.5 Sonnet, GPT-4o, Gemini 2.5 Pro, Llama 3.3, custom) to generate answer with citations.
        Supports consumer-specific models: LearningHub prefers GPT-4o, PROFESSOR-J prefers DeepSeek R1 free.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  example: What is Newton's second law?
                top_k:
                  type: integer
                  default: 5
                domain:
                  type: string
                  description: Domain filter for retrieval
                model:
                  type: string
                  default: deepseek/deepseek-r1:free
                  description: LLM model ID for generation, from frontier model catalog (DeepSeek R1, Claude 3.5 Sonnet, GPT-4o, Gemini 2.5 Pro, Llama 3.3, custom)
                  example: deepseek/deepseek-r1:free
                embedding_model:
                  type: string
                  default: sentence-transformers/all-MiniLM-L6-v2
                  description: Embedding model for retrieval
                consumer:
                  type: string
                  enum: [learninghub, professor-j, general]
                  default: general
                  description: Consumer for tailored response
      responses:
        '200':
          description: RAG answer with citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAGAnswer'

  /v2/export:
    get:
      summary: Export for specific consumer
      description: Export filtered knowledge for consumer like LearningHub, PROFESSOR-J
      parameters:
        - name: consumer
          in: query
          required: true
          schema:
            type: string
            enum: [learninghub, professor-j, general, stemma-explorer]
          description: Consumer ID from consumer-registry.yaml
        - name: format
          in: query
          schema:
            type: string
            enum: [json, jsonl, embeddings, vector_store]
            default: json
          description: Export format
        - name: review_policy
          in: query
          schema:
            type: string
            enum: [all, canonical, reviewed, trusted]
            default: canonical
      responses:
        '200':
          description: Export

components:
  schemas:
    Stats:
      type: object
      properties:
        entity_count:
          type: integer
        connection_count:
          type: integer
        source_count:
          type: integer
        content_hash:
          type: string
        export_version:
          type: string
        schema_version:
          type: string

    Entity:
      type: object
      properties:
        id:
          type: string
          example: stemma:phys.metre
        type:
          type: string
          enum: [concept, quantity, unit, constant, law, principle, theorem, equation, process, structure, algorithm, material]
        name:
          type: string
        domain:
          type: string
          enum: [physics, chemistry, biology, earth-science, astronomy, computer-science, engineering, mathematics]
        subdomain:
          type: string
        definition:
          type: string
        status:
          type: string
        provenance:
          type: object
        source_refs:
          type: array
          items:
            type: string
        external_ids:
          type: object

    Connection:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        relation:
          type: string
        evidence:
          type: array

    Embedding:
      type: object
      properties:
        entity_id:
          type: string
        model:
          type: string
        dimensions:
          type: integer
        vector:
          type: array
          items:
            type: number
        content_hash:
          type: string

    RAGResult:
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/Entity'
        score:
          type: number
          description: Cosine similarity score
        content:
          type: string
          description: Chunk used for retrieval

    RAGAnswer:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        citations:
          type: array
          items:
            type: object
            properties:
              entity_id:
                type: string
              source_ref:
                type: string
              link:
                type: string
        retrieved_entities:
          type: array
          items:
            $ref: '#/components/schemas/RAGResult'
        model_used:
          type: string
        embedding_model_used:
          type: string
        content_hash:
          type: string
