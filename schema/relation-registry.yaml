# Relation Registry — authoritative source for relation semantics
# Registry v1.0.0 (ADR-0028): reserved duplicates of adopted semantics were pruned
# (broader_than/narrower_than ≡ generalizes/special_case_of; contains ≡ has_part;
# is_a ≡ special_case_of for taxonomy). SKOS mapping targets: skos:broader/narrower.
# ADR-012; integrity-repaired by ADR-0021 (plan v2 E2.1/E2.7; audit F3).
# Validator enforces: registry membership, family, inverse/symmetric,
# transitive, domain/range, INVERSE COHERENCE (mutual + mirrored),
# and that domain/range reference known entity types only.
#
# status: adopted  — relation is used by canonical connections today.
#         reserved — defined for future use, zero canonical uses;
#                    do not introduce into canonical content without an ADR.
# Inverses are DERIVED (never stored canonically) but MUST be defined here
# so derived graph projections emit only legal relation names.
#
# Guardrails: extends/supersedes/isomorphic_to non-transitive; causal
# non-transitive; is_a = class/subclass only.
