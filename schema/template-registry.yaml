# Template Registry — COMPREHENSIVE ALL-STEM, evolvable, domain-agnostic, scales beyond physics
# v2.0.0 — Mediocre all-domain coverage, not minimal physics
# Each template defines how to generate entity markdown from extracted text
# Evolvable: new domains/types can be added without code change
# Supports standard definition fallback: if PDF doesn't have exact SI, use LLM or authoritative source
# Also supports embeddings and RAG

version: '2.0.0'

# All STEM domains — comprehensive, not just physics
# Science: physics, chemistry, biology, earth-science, astronomy
# Technology: computer-science
# Engineering: engineering
# Mathematics: mathematics
domains:
  physics:
    label: Physics
    subdomains: [mechanics, measurement-units, electricity-magnetism, thermal-physics, waves-optics, atomic-nuclear, quantum, relativity, fluid-mechanics, thermodynamics, optics, condensed-matter]
    governing_registry: schema/physics-governing-registry.yaml
    textbooks: [HRW 12th, University Physics, Feynman Lectures]
    authoritative_source: SI Brochure 9th ed. + NIST
  chemistry:
    label: Chemistry
    subdomains: [general, organic, inorganic, physical, analytical, biochemistry, polymer, electrochemistry, quantum-chemistry, materials-chemistry, environmental-chemistry]
    governing_registry: null
    textbooks: [Atkins Physical Chemistry, Clayden Organic, Housecroft Inorganic, Skoog Analytical]
    authoritative_source: IUPAC Gold Book + CRC Handbook
  biology:
    label: Biology
    subdomains: [general, molecular, cell-biology, genetics, evolution, ecology, physiology, microbiology, neuroscience, anatomy, botany, zoology, immunology, developmental]
    governing_registry: null
    textbooks: [Campbell Biology, Molecular Biology of the Cell, Lehninger Biochemistry]
    authoritative_source: NCBI + IUPAC + Nature
  earth-science:
    label: Earth Science
    subdomains: [geology, meteorology, oceanography, environmental, geography, climatology, seismology, hydrology, atmospheric, mineralogy]
    governing_registry: null
    textbooks: [Press & Siever, Essentials of Meteorology, Oceanography]
    authoritative_source: USGS + NASA + NOAA
  astronomy:
    label: Astronomy
    subdomains: [astrophysics, cosmology, planetary, stellar, galactic, observational, astrobiology, celestial-mechanics]
    governing_registry: null
    textbooks: [Carroll & Ostlie, Astrophysics, Fundamental Astronomy]
    authoritative_source: NASA + IAU + ESA
  computer-science:
    label: Computer Science
    subdomains: [algorithms, data-structures, programming-languages, software-engineering, artificial-intelligence, machine-learning, databases, networks, cybersecurity, operating-systems, theory, computer-architecture, graphics, compilers, distributed-systems]
    governing_registry: null
    textbooks: [CLRS, SICP, Patterson & Hennessy, Tanenbaum, Goodfellow Deep Learning]
    authoritative_source: ACM + IEEE + arXiv
  engineering:
    label: Engineering
    subdomains: [mechanical, electrical, civil, chemical, aerospace, biomedical, industrial, environmental, materials, software, nuclear, automotive, robotics]
    governing_registry: null
    textbooks: [Shigley Mechanical, Nilsson/Riedel Electric, Hibbeler Structural, Incropera Heat Transfer]
    authoritative_source: IEEE + ASME + ASCE + Engineering Handbooks
  mathematics:
    label: Mathematics
    subdomains: [algebra, geometry, calculus, statistics, probability, number-theory, discrete, linear-algebra, differential-equations, topology, analysis, logic, combinatorics, optimization]
    governing_registry: null
    textbooks: [Stewart Calculus, Dummit & Foote Algebra, Rudin Analysis, Strang Linear Algebra]
    authoritative_source: MathWorld + NIST DLMF + arXiv

# Entity types — comprehensive, covers all STEM, evolvable
entity_types:
  concept:
    label: Concept
    requires: [definition]
    description: Generic concept applicable to any domain — fundamental building block
    template: |
      ---
      id: stemma:{domain}.{slug}
      type: concept
      name: {name}
      domain: {domain}
      subdomain: {subdomain}
      status: draft
      definition: "{definition}"
      provenance:
        ai_drafted: {ai_drafted}
        writer: {writer}
        source_kind: {source_kind}
        source: "{source}"
        link: "{link}"
        original_author: "{original_author}"
        retrieved_at: "{retrieved_at}"
      source_refs: {source_refs}
      external_ids:
        wd: {wd}
      ---
      
      {definition}
  quantity:
    label: Quantity
    requires: [definition, symbol, unit, governed_by]
    description: Physical quantity with symbol and unit
