      dimensions: 3072
      free: false
      description: Frontier OpenAI embedding, 3072 dim, best quality
    - id: openai/text-embedding-3-small
      name: OpenAI Text Embedding 3 Small (Frontier, 1536 dim)
      provider: openai
      dimensions: 1536
