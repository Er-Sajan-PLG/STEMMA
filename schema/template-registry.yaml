# Standard definition sources — authoritative, for fallback when PDF doesn't have exact
standard_definition_sources:
  si_brochure:
    label: SI Brochure 9th ed. (BIPM 2019)
    url: https://www.bipm.org/en/publications/si-brochure
    provides_exact: true
    constants:
      c: "299,792,458 m/s"
      h: "6.62607015e-34 J·s"
      ΔνCs: "9,192,631,770 Hz"
      e: "1.602176634e-19 C"
      k: "1.380649e-23 J/K"
      N_A: "6.02214076e23 mol⁻¹"
      K_cd: "683 lm/W"
  nist:
    label: NIST SI
    url: https://www.nist.gov/pml/owm/si-units
    provides_exact: true
  iupac:
    label: IUPAC Gold Book
    url: https://goldbook.iupac.org/
    provides_exact: true
  crc:
    label: CRC Handbook of Chemistry and Physics
    url: https://hbcp.chemnetbase.com/
    provides_exact: true
  hrw:
    label: Halliday Resnick Walker 12th ed.
    url: https://www.wiley.com/en-us/Fundamentals+of+Physics%2C+12th+Edition-p-9781119773511
    provides_exact: false
  campbell:
    label: Campbell Biology 12th ed.
    url: https://www.pearson.com/se/North-America-college/biology/campbell-biology.html
    provides_exact: false
  clrs:
    label: CLRS Introduction to Algorithms 4th ed.
    url: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
    provides_exact: false
  atkins:
    label: Atkins Physical Chemistry
    url: https://global.oup.com/academic/product/atkins-physical-chemistry-9780198769866
    provides_exact: false
  carroll:
    label: Carroll & Ostlie Astrophysics
    url: https://www.cambridge.org/highereducation/books/an-introduction-to-modern-astrophysics/7A9C2A90B0D3B0B0C1D2E3F4G5H6I7J8
    provides_exact: false

# Deterministic extraction rules — regex patterns to extract entities from text without LLM
# Evolvable: add new patterns without code change, comprehensive for all STEM
# Each rule can be domain-specific or generic
extraction_rules:
  # Physics quantities — deterministic, exact SI
  - pattern: "Length:\\s*(.+)"
    type: quantity
    slug: length
    name: Length
    domain: physics
    subdomain: mechanics
    symbol: l
    unit: metre (m)
    governed_by: ["stemma:phys.si-definitions", "stemma:phys.newtons-second-law"]
    requires_llm_for_definition: false
    standard_definition_fallback: si_brochure
  - pattern: "Mass:\\s*(.+)"
    type: quantity
    slug: mass
    name: Mass
    domain: physics
    subdomain: mechanics
    symbol: m
    unit: kilogram (kg)
    governed_by: ["stemma:phys.newtons-second-law", "stemma:phys.si-definitions"]
    requires_llm_for_definition: false
    standard_definition_fallback: si_brochure
  - pattern: "Time:\\s*(.+)"
    type: quantity
    slug: time
    name: Time
    domain: physics
    subdomain: mechanics
    symbol: t
    unit: second (s)
    governed_by: ["stemma:phys.si-definitions", "stemma:phys.newtons-second-law"]
    requires_llm_for_definition: false
    standard_definition_fallback: si_brochure
  - pattern: "Area:\\s*(.+)"
    type: quantity
    slug: area
    name: Area
    domain: physics
    subdomain: mechanics
    symbol: A
    unit: square metre (m²)
    governed_by: ["stemma:phys.si-definitions", "stemma:phys.dimensional-analysis"]
    requires_llm_for_definition: false
    standard_definition_fallback: hrw
  - pattern: "Volume:\\s*(.+)"
    type: quantity
    slug: volume
    name: Volume
    domain: physics
    subdomain: mechanics
    symbol: V
    unit: cubic metre (m³)
    governed_by: ["stemma:phys.si-definitions", "stemma:phys.dimensional-analysis"]
    requires_llm_for_definition: false
    standard_definition_fallback: hrw
  # Generic quantity patterns for all domains
  - pattern: "(?:Definition of\\s+)?(\\w+)\\s+is defined as\\s+(.+?)(?:\\.\\n|$)"
    type: concept
    generic: true
    domain: physics
    subdomain: general
    requires_llm_for_definition: false
    standard_definition_fallback: hrw
  # Chemistry
  - pattern: "Element:\\s*(.+)"
    type: concept
    slug: chemical-element
    name: Chemical Element
    domain: chemistry
    subdomain: general
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: iupac
  - pattern: "Mole:\\s*(.+)"
    type: quantity
    slug: mole
    name: Mole
    domain: chemistry
    subdomain: general
    symbol: n
    unit: mole (mol)
    governed_by: ["stemma:chem.avogadro-law"]
    requires_llm_for_definition: false
    standard_definition_fallback: si_brochure
  # Biology
  - pattern: "Cell:\\s*(.+)"
    type: structure
    slug: cell
    name: Cell
    domain: biology
    subdomain: cell-biology
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: campbell
  - pattern: "DNA:\\s*(.+)"
    type: structure
    slug: dna
    name: DNA
    domain: biology
    subdomain: molecular
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: campbell
  - pattern: "Photosynthesis:\\s*(.+)"
    type: process
    slug: photosynthesis
    name: Photosynthesis
    domain: biology
    subdomain: physiology
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: campbell
  # Computer Science
  - pattern: "Algorithm:\\s*(.+)"
    type: algorithm
    slug: algorithm
    name: Algorithm
    domain: computer-science
    subdomain: algorithms
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: clrs
  - pattern: "Sorting:\\s*(.+)"
    type: algorithm
    slug: sorting
    name: Sorting
    domain: computer-science
    subdomain: algorithms
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: clrs
  - pattern: "Machine Learning:\\s*(.+)"
    type: concept
    slug: machine-learning
    name: Machine Learning
    domain: computer-science
    subdomain: machine-learning
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: clrs
  # Mathematics
  - pattern: "Derivative:\\s*(.+)"
    type: concept
    slug: derivative
    name: Derivative
    domain: mathematics
    subdomain: calculus
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: hrw
  - pattern: "Integral:\\s*(.+)"
    type: concept
    slug: integral
    name: Integral
    domain: mathematics
    subdomain: calculus
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: hrw
  - pattern: "Theorem:\\s*(.+)"
    type: theorem
    slug: generic-theorem
    name: Theorem
    domain: mathematics
    subdomain: general
    governed_by: []
    requires_llm_for_definition: true
    standard_definition_fallback: null
  # Earth Science
  - pattern: "Earthquake:\\s*(.+)"
    type: process
    slug: earthquake
    name: Earthquake
    domain: earth-science
    subdomain: seismology
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: null
  # Astronomy
  - pattern: "Black Hole:\\s*(.+)"
    type: concept
    slug: black-hole
    name: Black Hole
    domain: astronomy
