    standard_definition_fallback: carroll
  # Engineering
  - pattern: "Stress:\\s*(.+)"
    type: quantity
    slug: stress
    name: Stress
    domain: engineering
    subdomain: mechanical
    symbol: σ
    unit: pascal (Pa)
    governed_by: []
    requires_llm_for_definition: false
    standard_definition_fallback: null

# When PDF doesn't have standard definition, use LLM to fetch from authoritative source
# LLM fallback is optional, only when deterministic fails
llm_fallback:
  enabled: true
  when: "PDF text doesn't contain exact definition with fixed constants or authoritative source"
  prompt_template: |
    You are STEMMA standard definition fetcher — comprehensive all-STEM.
    The PDF extracted text does NOT contain exact definition for {slug}.
    Fetch standard scientific definition from authoritative source {fallback_source}.
    Must include exact value if applicable and agreed status.
    Example metre: "The metre (symbol: m) is base unit of length in SI. Defined as length of path travelled by light in vacuum during 1/299,792,458 s. Exact c=299,792,458 m/s. Agreed per BIPM SI Brochure 9th ed. 2019."
    Example chemical element: "Chemical element is species of atoms that have same number of protons in atomic nuclei. Defined per IUPAC Gold Book. Exact: atomic number Z. Agreed per IUPAC."
    Example algorithm: "Algorithm is finite sequence of rigorous instructions, typically used to solve class of specific problems. Defined per CLRS Introduction to Algorithms. Agreed per ACM."
    Entity: {name} ({slug}), type {type}, domain {domain}, subdomain {subdomain}
    PDF context: {pdf_context}
    Output: JSON with definition field containing standard definition with source reference.
  requires_hitl: true  # Even LLM fallback requires human edit before canonical

# Embedding configuration — for RAG and consumer export
