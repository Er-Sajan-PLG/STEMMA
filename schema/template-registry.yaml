      name: All-MPNet-Base-V2 (Local, 768 dim)
      provider: local
      dimensions: 768
      free: true
      description: High quality local, 768 dim
    - id: BAAI/bge-large-en-v1.5
      name: BGE Large (Local, 1024 dim, SOTA)
