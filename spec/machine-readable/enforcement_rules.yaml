# STEMMA enforcement rules — machine-readable, authoritative over prose.
#
# WHY THIS FILE EXISTS (owner ruling 2026-10-01):
#   "real time gate the validation, do not let me validate, independent validate
#    and board validate at the same time, keep 1 day time different and I cannot
#    break it ... Keep it in record, not in ADR — a strong enough place to enforce it."
#
# An ADR is a narrative artifact; narrative is not enforcement. Rules that the
# owner must NOT be able to bypass live here, as data, and are read byte-for-byte
# by scripts/validate.py (the fail-closed gate) and by scripts/review_entity.py
# (the promotion CLI). Changing a rule means changing this file, which the gate
# then re-reads on the next run — there is no second source to drift from.
#
# Each rule carries: id, statement, enforcing_script, enforcement_point and a
# machine-readable `rule:` block. The gate refuses on violation; the CLI refuses
# to record a promotion that would violate one.
rules_version: 1
rules:
  - id: ENF-STEMMA-HITL-001
    title: Promotion stages must not share a calendar day
    statement: >-
      The initial validator, the independent validator and the board must not act
      on the same record on the same day. Consecutive promotion stages of one
      record SHALL be separated by at least one full calendar day. A canonical
      decision reached in one sitting is biased and SHALL NOT be recorded.
    applies_to: [entity, connection]
    normative_strength: SHALL NOT
    enforced_by: []          # populated below; declared for traceability
    rule:
      kind: min_stage_gap
      min_days: 1
      stages: [validator, independent_validator, board]
      compare: consecutive_stages_of_same_record
    enforcement_point:
      gate: "scripts/validate.py:check_promotion_chain -> _check_stage_time_gaps"
      cli: "scripts/review_entity.py:promote (refuses same-day stage advance)"
    rationale: >-
      Owner directive 2026-10-01. The owner currently holds all three roles; if
      all three acts land on one day the chain is a formality, not a review.
    related_adr: ADR-0057
    related_requirement: REQ-STEMMA-HITL-003
    owner: Sajan
    recorded_by: executor
    recorded_at: "2026-10-01"

  - id: ENF-STEMMA-HITL-002
    title: Outstanding revalidation debt blocks the record outright (pilot scale)
    statement: >-
      While the corpus is at pilot scale, a record with revalidation_debt.status
      'outstanding' SHALL NOT be valid at all: holding ANY promotion or review
      status (validator_validated, independently_validated, board_approved,
      human_reviewed, canonical) with outstanding debt is a gate FAILURE. Debt
      must be cleared AND the record re-validated before it may hold a reviewed
      status. The validator MUST be told which record carries debt at the moment
      it is validated. See pilot_scale_block below: this full block is a
      deliberate, time-boxed choice so the owner can observe at what corpus size
      debt starts to cause trouble, and is expected to relax to forward-only
      blocking at scale.
    applies_to: [entity, connection]
    normative_strength: SHALL NOT
    rule:
      kind: debt_blocks_status
      debt_status: outstanding
      blocked_statuses: [human_reviewed, validator_validated, independently_validated, board_approved, canonical]
      block_mode: full          # full | forward_only
      report_debt_identity: true
    pilot_scale_block:
      active: true
      owner: Sajan
      sanctioned_at: "2026-10-01"
      reason: >-
        Owner ruling 2026-10-01: "for debt at this small scale, actually block it
        fully until it is updated and validated. At starting phases, I can handle
        it; let's see how much entity it takes for debt to cause problem."
      observation_goal: >-
        Measure the corpus size at which full debt blocking becomes a burden —
        that measurement is an input to the still-OPEN method/tier decisions
        (UNRES-STEMMA-CORE-003), not a decision in itself.
      relaxes_to: forward_only
      retire_when: >-
        the owner judges the burden visible and rules on the PART 2 tier
        thresholds (UNRES-STEMMA-CORE-003); relaxing is an owner act
    enforcement_point:
      gate: "scripts/validate.py:check_revalidation_debt"
      cli: "scripts/review_entity.py:promote (refuses while debt outstanding)"
    rationale: >-
      Owner directive 2026-10-01: debt must be visible in frontmatter and the
      validator cannot complete validation until the debt is fixed. At pilot
      scale a full block is cheap and makes the debt impossible to ignore.
    related_adr: ADR-0057
    related_requirement: REQ-STEMMA-HITL-003
    owner: Sajan
    recorded_by: executor
    recorded_at: "2026-10-01"

  - id: ENF-STEMMA-HITL-003
    title: Independence or a recorded owner waiver
    statement: >-
      Consecutive promotion stages of one record SHALL be performed by distinct
      human agents, and a board stage SHALL name at least two distinct human
      members. When the performers are not all distinct, the promotion SHALL
      carry an owner-sanctioned independence_waiver naming sanctioned_by and
      retire_when. Absence of either is a gate failure. While the owner is the
      only registered validator, the BOARD stage itself is waved (see
      board_waiver below): the required chain becomes validator ->
      independent_validator, and canonical is reachable from the
      independent_validator stage.
    applies_to: [entity, connection]
    normative_strength: SHALL
    rule:
      kind: independence_or_waiver
      stages: [validator, independent_validator, board]
      distinct_within: consecutive
      board_min_members: 2
      waiver_fields_required: [sanctioned_by, reason, retire_when]
    board_waiver:
      active: true
      required_stages_while_waived: [validator, independent_validator]
      terminal_status_while_waived: canonical
      owner: Sajan
      sanctioned_at: "2026-10-01"
      reason: >-
        Owner ruling 2026-10-01: "waive the board for now as I am the only
        validator." The board stage presumes a >=2-human panel that does not yet
        exist; forcing it would make canonical unreachable or a fiction.
      retire_when: >-
        a second active human agent with a validation role is registered
        (schema/agent-registry.yaml), at which point ENF-STEMMA-HITL-004's full
        three-stage chain (including board, >=2 humans) applies again
    enforcement_point:
      gate: "scripts/validate.py:check_promotion_chain"
      cli: "scripts/review_entity.py:promote"
    rationale: >-
      Independence is the point of the chain (spec/ROLES_AND_AUTHORITY.md
      SOLE_OWNER limitation record). The interim single-actor reality is legal
      only when made visible and time-boxed.
    related_adr: ADR-0057
    related_requirement: REQ-STEMMA-HITL-003
    owner: Sajan
    recorded_by: executor
    recorded_at: "2026-10-01"

  - id: ENF-STEMMA-HITL-004
    title: The validator is not the final canonicalizer
    statement: >-
      No single act MAY set a record to 'canonical'. Canonical SHALL be
      reachable only after an ordered chain, all recorded in
      provenance.promotion_history. The full chain is validator ->
      independent_validator -> board; while the board waiver (ENF-STEMMA-HITL-003
      board_waiver) is active the required chain is validator ->
      independent_validator, and canonical follows that shorter chain. Jumping
      straight from draft (or any single review) to canonical SHALL fail the gate.
    applies_to: [entity, connection]
    normative_strength: SHALL
    rule:
      kind: staged_ladder
      required_stages: [validator, independent_validator, board]
      terminal_status: canonical
      allow_direct_jump: false
      # active chain is resolved at gate time against ENF-STEMMA-HITL-003's
      # board_waiver: when waived, required_stages becomes the two-stage chain.
    enforcement_point:
      gate: "scripts/validate.py:check_promotion_chain"
      cli: "scripts/review_entity.py:promote (advances exactly one stage)"
    rationale: >-
      Owner directive 2026-10-01: "the validator is not the final canonicalizer,
      it will be verified by another validator and it will finally reach board
      where multiple validators will finally validate it." The board stage is
      waived only because a >=2-human panel does not yet exist.
    related_adr: ADR-0057
    related_requirement: REQ-STEMMA-HITL-003
    owner: Sajan
    recorded_by: executor
    recorded_at: "2026-10-01"
