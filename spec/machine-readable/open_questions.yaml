- id: UNRES-STEMMA-HITL-001
  question: HITL audit trail (workflow/) is git-ignored — review evidence not repository-portable; provenance relies
    on local state + declared metadata.
  status: CLOSED
  blocking: false
  blocking_impact: Trust claim non-verifiable on fresh clone — affects REQ-STEMMA-HITL-001 verification
  proposed_resolution: 'Owner decides: commit workflow/ (with redaction rules), or accept local-state provenance.'
  authority_required: SOLE_OWNER
  related:
  - EVID-STEMMA-HITL-002
  - REQ-STEMMA-HITL-001
  - ADR-0043
  disposition: 'Owner ruled 2026-10-01 (option (c) of spec/UNRES-DECISIONS.md section 2): COMMIT A SIGNED PROVENANCE
    SUMMARY (hash-only manifest). Chosen over (a) committing the redacted trail — which would depend on the UNRES-STEMMA-OPS-001
    ruling — and over (b) accepting local-state provenance, which narrows the trust claim instead of fixing it.
    scripts/review_manifest.py emits spec/machine-readable/review_manifest.json containing, per reviewed record:
    the id, kind, relpath, declared provenance (writer/reviewer/reviewed_at), the ordered promotion history, and
    a sha256 of the record file. It emits no definition text and no source excerpts, so it is committable under
    any licensing position (see the XC-3 amendment). Ruled together with UNRES-STEMMA-OPS-001.'
  resolution: 'CLOSED. A fresh clone can now verify the review claim without the git-ignored workflow/ trail: it
    can see WHICH records were reviewed, BY WHOM, WHEN, and through which ordered stages, and it can confirm each
    reviewed artifact is still byte-identical to the state that was reviewed. Generated then verified in the gate
    (scripts/verify_all.py runs review_manifest.py then review_manifest.py --check), so a post-review edit to a
    canonical record fails CI rather than silently invalidating the claim. Non-vacuity proven: editing a reviewed
