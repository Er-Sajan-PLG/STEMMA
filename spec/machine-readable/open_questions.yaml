- id: UNRES-STEMMA-RAG-001
  question: Fake/hash-fallback embedding determinism accepted? Environment lacks model downloads; derived-layer
    semantics for real vectors undefined at pilot scope.
  status: CLOSED
  blocking: false
  proposed_resolution: Second pilot scope on derived layer; not blocking foundation slice.
  authority_required: SOLE_OWNER
  related:
  - EVID-STEMMA-EXP-003
  - CONFLICT-STEMMA-EXP-001
  disposition: 'Owner ruled 2026-10-01 (option (a) of spec/UNRES-DECISIONS.md section 5): the deterministic hash
    fallback is SANCTIONED as explicit pilot behaviour, and the metadata mislabel is fixed. Two halves were being
    treated as one. (1) Determinism of the fallback: acceptable as a declared, clearly-labelled pilot behaviour
    — it is emitted only under the explicit --placeholder flag, is labelled stemma:placeholder-hash (never the requested
    model id), and carries placeholder: true; generate_embeddings_local REFUSES (EmbeddingUnavailable) rather than
    silently substituting a hash vector, so no consumer can mistake it for a real embedding. (2) Truthfulness of
    the metadata: meta.json asserted type: faiss while no FAISS index existed — fixed independently (scripts/embed.py
    now records numpy-flat|json-flat; CONFLICT-STEMMA-EXP-001 truthfulness half RESOLVED, EVID-STEMMA-EXP-019),
    and the stale claim was swept from four living docs.'
  resolution: 'CLOSED. The fake-embedding fallback is sanctioned PILOT BEHAVIOUR, not a shipped reference vector
    store: it is opt-in (--placeholder), self-labelling (stemma:placeholder-hash + placeholder: true), refused-otherwise
    (real model absence is an error, never a silent fallback), and must never be committed or published as a real
    index. Derived-layer semantics for REAL vectors remain out of pilot scope and are deferred to a second pilot
    on the derived layer — a scope boundary, not an open defect. CI does NOT require a model download (the pilot
    is offline by constraint); the guarantee is instead that a placeholder store is never silently mistaken for
    a real one.'
  closed_date: '2026-10-01'
  closed_by: human:curator.001
- id: UNRES-STEMMA-OPS-001
  question: Does any rights/licensing review exist for book*-textbook source bodies (excerpt scale, attribution,
    licence)?
  status: CLOSED
  blocking: false
  proposed_resolution: Owner supplies rights documentation or marks acceptable-risk; license-compliance then an
    XC amendment.
  authority_required: SOLE_OWNER
  related:
  - EVID-STEMMA-CORE-005
  - XC-6
  disposition: 'Owner ruled 2026-10-01 (option (b) of spec/UNRES-DECISIONS.md section 3): EXCERPT-FREE METADATA
    ONLY. Recorded as an XC-3 amendment in spec/EXTERNAL_CONSTRAINTS.md. Committable from a copyrighted textbook:
    (1) citation metadata only (title, authors, year, publisher, edition, ISBN, URL, language, source_role, locator)
    — what sources/*.yaml already holds; (2) re-expressed definitions written in STEMMA''s own voice (facts/ideas
    are not copyrightable; expression is). Never committable: source PDFs, verbatim passages however short, and
    anything under workflow/. Ruled together with UNRES-STEMMA-HITL-001 because committing audit material could
    pull excerpts into git; the hash-only manifest chosen there is excerpt-free by construction, so the two are
    jointly satisfied.'
  resolution: 'CLOSED. This is a conservative owner POLICY position, not external legal advice: by holding no verbatim
    reproduction at all, the project relies on no fair-use/fair-dealing defence, which would vary by jurisdiction.
    Enforcement is structural, not aspirational: sources/*.yaml carry citation metadata with no body-text field;
    scripts/review_manifest.py is hash-only and tests/repo/test_review_manifest.py asserts no definition fragment
    and no text-bearing key appears in it. Residual recorded: if short quotations are ever wanted for audit fidelity,
    that is a NEW decision requiring explicit attribution terms and a numeric excerpt cap. Consequence for REQ-STEMMA-OPS-005:
    citation-complete sources/*.yaml satisfy the source-registry obligation; no derived-text distribution occurs,
    so no derived-span licensing review is outstanding.'
  closed_date: '2026-10-01'
  closed_by: human:curator.001
