- id: UNRES-STEMMA-CORE-002
  question: Should the generality guard (test_generality.py SCOPING_FIELDS) drop its ^...$ anchors so it also rejects prefixed/suffixed scoping keys (grade_level, grade_band, curriculum_scope, target_grade)?
  status: CLOSED
  blocking: false
  disposition: 'RESOLVED (owner ruling 2026-10-01): option (c) — WIDEN the guard, then mutation-test it. Implemented the same day. SCOPING_FIELDS (the ^...$-anchored regex) was replaced by a token-based matcher: `_scoping_tokens` splits an identifier on separators/camelCase/digits, `_joined_token_forms` restores contiguous n-grams so multi-word names (key_stage, learning_objectives) match in either spelling, and `_is_scoping_field` matches whole tokens (never substrings, so upgrade_notes/multigrade stay legitimate). `level` is handled specially: only an education-qualified level (edu_level, grade_level) is a scoping claim; trophic_level/energy_level/sea_level are not. The guard now catches 28 formerly-missed variants. Three new tests: catches_prefixed_variants, does_not_overreach (negative control), and widened_guard_is_enforced_end_to_end. Non-vacuity proven by mutation — reverting the matcher to the anchored form turns exactly those tests red (EVID-STEMMA-CORE-010). REQ-STEMMA-CORE-004
    re-verified: FAILED -> VERIFIED.'
  proposed_resolution: 'Executor finding, 2026-10-01 (EVID-STEMMA-CORE-006/007): the guard is ^...$-anchored and therefore matches only exact key names. The gap is defence-in-depth only — concept.schema.json''s additionalProperties:false still rejects such keys at the validator (exit 1), so no violation can ship. Fixing the guard is an owner decision; the executor may execute verification and record results but not self-approve a code change and then mark it VERIFIED. Options: (a) widen the pattern to a prefix match; (b) leave it, relying on the schema layer; (c) widen and add a permanent mutation test that asserts the guard itself rejects prefixed keys.'
  authority_required: SOLE_OWNER
  related:
  - REQ-STEMMA-CORE-004
  - EVID-STEMMA-CORE-006
  - EVID-STEMMA-CORE-007
  - EVID-STEMMA-CORE-010
- id: UNRES-STEMMA-GATE-001
  question: 'The all-green merge gate is not a required status check on main: should ''Full Test Suite (pytest)'' and ''All Checks Green — Nothing Bad Gets Merged'' be added to the repository''s required checks so a red suite actually blocks a merge?'
  status: CLOSED
  blocking: false
  disposition: 'RESOLVED (owner action 2026-10-01, same day). The owner added both contexts to the required status checks. Re-inspection of the active main ruleset (22215824) now shows 7 required checks, including ''All Checks Green — Nothing Bad Gets Merged'' and ''Full Test Suite (pytest)'', with strict_required_status_checks_policy = true. Each required context was compared byte-for-byte against the status names CI actually reports (run 36316235760) and both EXACT MATCH (including the em-dash), so the checks bind rather than silently never matching. The failure path was already fail-closed: all-green does ''exit 1'' on any non-success dependency including test-suite, so a red suite now genuinely blocks a merge. REQ-STEMMA-GATE-003 re-verified: FAILED -> VERIFIED (EVID-STEMMA-GATE-018).'
  blocking_impact: 'Was blocking REQ-STEMMA-GATE-003. Note for the record: the repo''s legacy branch-protection endpoint (branches/main/protection) does NOT reflect ruleset-based rules — it still lists only the original five. The authoritative source is the effective-rules endpoint (repos/.../rules/branches/main), which is what a future verifier should query.'
  proposed_resolution: 'Owner action in repository settings (the executor has no authority to change branch protection, and changing it is a governance act, not a code change): add ''Full Test Suite (pytest)'' and ''All Checks Green — Nothing Bad Gets Merged'' to the required status checks for main. Adding all-green alone is sufficient once it is the single aggregate gate, since it already asserts every other job''s result; adding the pytest job as well keeps the failure legible when the suite is the cause. After the change, re-verify GATE-003 by inspection of the required-check list.'
  authority_required: SOLE_OWNER
  related:
  - REQ-STEMMA-GATE-003
  - EVID-STEMMA-GATE-016
  - EVID-STEMMA-GATE-017
  - EVID-STEMMA-GATE-018
- id: UNRES-STEMMA-HITL-002
  question: 'HITL enforcement is vacuous in CI and violated in the corpus: `hitl_check.py --check-workflow` (the chain''s own invocation, verify_all.py:31) audits a git-ignored, empty workflow/ directory and exits 0 with ''nothing to check'', while 6 of 9 canonical entities declare an LLM writer. `hitl_check.py --all` returns exit 1 with ''9/9 entities fail HITL''. How should human review be enforced?'
  status: CLOSED
  blocking: false
  blocking_impact: Blocks REQ-STEMMA-HITL-001 and REQ-STEMMA-HITL-002. The claim 'AI-drafted content remains draft until a named human reviews it' is currently not backed by any gate that runs in CI over content/.
  proposed_resolution: 'Owner decision, three separable parts. (1) SCOPE: should the chain run hitl_check in a mode that covers content/ (e.g. --all), not only workflow/? Note this would currently FAIL the build, so it needs a migration plan. (2) EXISTING ENTITIES: 6 canonical entities (conservation-energy, force, length, mass, newtons-second-law, time) carry writer=llm:coding-agent.001. Either they were in fact human-reviewed and the metadata is wrong (then correct the metadata and record the review), or they were not reviewed and should be demoted to draft until they are. Deciding this is a governance act reserved to the owner — the executor will not rewrite provenance unilaterally. (3) ENFORCEMENT LAYER: validate.py''s human-reviewer rule (check_connection_agents) applies only to connections/, never to content/; should the analogous rule be added for canonical content entities? Related: UNRES-STEMMA-HITL-001 (audit-trail portability) must be resolved too, otherwise any HITL evidence stays
    non-verifiable on a fresh clone.'
  authority_required: SOLE_OWNER
  related:
  - REQ-STEMMA-HITL-001
  - REQ-STEMMA-HITL-002
  - EVID-STEMMA-HITL-003
  - EVID-STEMMA-HITL-004
  - EVID-STEMMA-HITL-005
  - UNRES-STEMMA-HITL-001
  resolution: 'Owner ruling 2026-10-01 (sole owner, human:curator.001). Three parts, all executed. (1) SCOPE: HITL scope is ALL data — content/ and every entity type, not only connections/. The chain now runs `hitl_check.py --all` (verify_all.py step 8), which audits content/ + connections/, replacing the vacuous `--check-workflow` over the git-ignored workflow/ dir. (2) EXISTING ENTITIES: the 6 LLM-written canonical entities (conservation-energy, force, length, mass, newtons-second-law, time) were demoted to draft and their unsupported human-review claims (reviewer/reviewed_at) removed; conn.000157 (canonical, LLM-asserted, citing two now-draft endpoints) was demoted to unreviewed. Corpus: 1 canonical (metre) / 8 clean drafts. (3) ENFORCEMENT: validate.py now enforces a content-layer human-writer+reviewer rule (check_entity_agents) plus canonical-endpoint coupling for connections — the validator validates everything it is given. All gates mutation-proven non-vacuous; verify_all.py exit
    0, docs.py check PASS, 289 tests pass. REQ-STEMMA-HITL-001 and REQ-STEMMA-HITL-002 flipped FAILED->VERIFIED. Residual: UNRES-STEMMA-HITL-001 (audit-trail portability) remains OPEN.'
  closed_date: '2026-10-01'
  closed_by: human:curator.001
- id: UNRES-STEMMA-CORE-003
  question: 'Canonical status is time-relative: an entity may be legitimately canonicalized before the corpus contains enough entities for meaningful connections, but once more entities exist that *should* connect to it, it owes those connections and must be re-validated. How is this ''canonical now, revalidation owed later'' debt modelled, and how do the validation METHODS themselves evolve as the corpus grows from tens to millions/billions of entities?'
  status: OPEN
  blocking: true
  blocking_impact: 'The current protocol treats canonical as a terminal state reached once, gated once. At scale that is unsound in both directions: (a) an early canonical entity can silently become connection-incomplete as the graph grows around it, with no gate that notices; (b) validation methods calibrated for a 9-entity corpus (exhaustive, per-entity, whole-corpus re-run in verify_all) cannot run over 10^6-10^9 entities at acceptable cost, so the gate that currently carries the whole trust claim stops being executable. Blocks a defensible claim that L4 (verified) stays verified as the corpus grows — i.e. it is a precondition for L5 (enforced) and for any corpus-scale claim.'
  context: 'Owner observation 2026-10-01: ''the canonicalized entity can be upgraded specially in connection because in early entity addition, there might not be enough entity to have connection information but as entity gets added to millions to billions, all entities must get updated, and they must be validated as well by the validator, that means validating towards end or when entities becomes more is more difficult and methods will evolve as well along the way.'' The live corpus illustrates the seed of the problem: conn.000157 (force -> mass) was canonical-worthy only while both endpoints were canonical; the HITL ruling (UNRES-STEMMA-HITL-002) demoted the endpoints and the connection followed. Nothing in the protocol expressed that dependency as a *debt* — it was caught only because a validator rule happened to exist.'
  scope_parts:
  - 'PART 1 (revalidation debt): when entity E reaches canonical, record the corpus state (or graph state) at approval. As new entities arrive that should connect to E (same domain/subdomain, relation domain/range satisfied, etc.), E accrues explicit, trackable ''revalidation owed'' debt. E stays canonical but flagged. Debt must be cleared — or explicitly deferred by the owner with a recorded reason — before the next baseline. DECISION TAKEN (owner, 2026-10-01): provisional canonical + revalidation debt, NOT auto-demote-on-new-entity (a single new entity must not cascade into thousands of demotions).'
  - 'PART 2 (method evolution): validation methods tier by corpus size, with declared thresholds (e.g. exhaustive per-entity below a threshold; sampled + statistical confidence above it; locality/graph-consistency based above a larger threshold). Which tier runs is a function of the measured corpus size and is recorded. The tier thresholds and definitions are themselves governed by ADR so they cannot drift silently. DECISION TAKEN (owner, 2026-10-01): tiered methods, ADR-governed tier boundaries.'
  - 'PART 3 (upgrade path): an entity canonicalized with no connections must have a defined route to gain connections and be re-validated without being demoted and re-created — i.e. an additive, supersede-don''t-edit-compatible promotion of its connection-completeness, with the new connections themselves HITL-reviewed.'
  what_is_NOT_decided: The debt data model (where debt lives — entity frontmatter, a derived index, or a review-queue record); the exact 'should connect' predicate (candidate generation strategy at scale); the numeric tier thresholds; whether 'connection-complete' is a per-entity boolean, a coverage ratio, or a graph-level invariant; and how debt interacts with the supersede-don't-edit rule (a debt-clearing edit is additive, but is it a new revision?). These are the questions the owner must rule on before implementation.
  proposed_resolution: 'Owner rules on the three scope parts (two already decided in principle 2026-10-01) and on the open questions in what_is_NOT_decided. On ruling, the executor will: (a) add the requirement(s) for revalidation debt and tiered validation; (b) write the ADR(s) fixing the tier boundaries; (c) implement a first revalidation-debt detector as a gate; (d) record the migration for the current 1-canonical/8-draft corpus. No implementation before the ruling — this touches the meaning of ''canonical'', which is a governance act reserved to the owner.'
  authority_required: SOLE_OWNER
  related:
  - REQ-STEMMA-HITL-001
  - REQ-STEMMA-HITL-002
  - UNRES-STEMMA-HITL-001
  - UNRES-STEMMA-OPS-001
  - EVID-STEMMA-HITL-006
  - EVID-STEMMA-HITL-008
  related_adr_files:
  - docs/decisions/0045-value-slot.md
  - docs/decisions/0056-adoption-provenance.md
  domain_note: 'Filed under CORE: the lifecycle of canonical status is a property of the canonical corpus (identity/history), not a new governance domain.'
