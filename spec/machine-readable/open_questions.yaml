  - EVID-STEMMA-GATE-016
  - EVID-STEMMA-GATE-017
  - EVID-STEMMA-GATE-018
- id: UNRES-STEMMA-HITL-002
  question: 'HITL enforcement is vacuous in CI and violated in the corpus: `hitl_check.py --check-workflow` (the
    chain''s own invocation, verify_all.py:31) audits a git-ignored, empty workflow/ directory and exits 0 with
    ''nothing to check'', while 6 of 9 canonical entities declare an LLM writer. `hitl_check.py --all` returns exit
    1 with ''9/9 entities fail HITL''. How should human review be enforced?'
  status: CLOSED
  blocking: false
  blocking_impact: Blocks REQ-STEMMA-HITL-001 and REQ-STEMMA-HITL-002. The claim 'AI-drafted content remains draft
    until a named human reviews it' is currently not backed by any gate that runs in CI over content/.
  proposed_resolution: 'Owner decision, three separable parts. (1) SCOPE: should the chain run hitl_check in a mode
    that covers content/ (e.g. --all), not only workflow/? Note this would currently FAIL the build, so it needs
    a migration plan. (2) EXISTING ENTITIES: 6 canonical entities (conservation-energy, force, length, mass, newtons-second-law,
    time) carry writer=llm:coding-agent.001. Either they were in fact human-reviewed and the metadata is wrong (then
    correct the metadata and record the review), or they were not reviewed and should be demoted to draft until
    they are. Deciding this is a governance act reserved to the owner — the executor will not rewrite provenance
    unilaterally. (3) ENFORCEMENT LAYER: validate.py''s human-reviewer rule (check_connection_agents) applies only
    to connections/, never to content/; should the analogous rule be added for canonical content entities? Related:
    UNRES-STEMMA-HITL-001 (audit-trail portability) must be resolved too, otherwise any HITL evidence stays non-verifiable
    on a fresh clone.'
  authority_required: SOLE_OWNER
  related:
  - REQ-STEMMA-HITL-001
  - REQ-STEMMA-HITL-002
  - EVID-STEMMA-HITL-003
  - EVID-STEMMA-HITL-004
  - EVID-STEMMA-HITL-005
  - UNRES-STEMMA-HITL-001
  resolution: 'Owner ruling 2026-10-01 (sole owner, human:curator.001). Three parts, all executed. (1) SCOPE: HITL
    scope is ALL data — content/ and every entity type, not only connections/. The chain now runs `hitl_check.py
    --all` (verify_all.py step 8), which audits content/ + connections/, replacing the vacuous `--check-workflow`
    over the git-ignored workflow/ dir. (2) EXISTING ENTITIES: the 6 LLM-written canonical entities (conservation-energy,
    force, length, mass, newtons-second-law, time) were demoted to draft and their unsupported human-review claims
    (reviewer/reviewed_at) removed; conn.000157 (canonical, LLM-asserted, citing two now-draft endpoints) was demoted
    to unreviewed. Corpus: 1 canonical (metre) / 8 clean drafts. (3) ENFORCEMENT: validate.py now enforces a content-layer
    human-writer+reviewer rule (check_entity_agents) plus canonical-endpoint coupling for connections — the validator
    validates everything it is given. All gates mutation-proven non-vacuous; verify_all.py exit 0, docs.py check
    PASS, 289 tests pass. REQ-STEMMA-HITL-001 and REQ-STEMMA-HITL-002 flipped FAILED->VERIFIED. Residual: UNRES-STEMMA-HITL-001
    (audit-trail portability) remains OPEN.'
  closed_date: '2026-10-01'
  closed_by: human:curator.001
- id: UNRES-STEMMA-CORE-003
  question: 'Canonical status is time-relative: an entity may be legitimately canonicalized before the corpus contains
    enough entities for meaningful connections, but once more entities exist that *should* connect to it, it owes
    those connections and must be re-validated. How is this ''canonical now, revalidation owed later'' debt modelled,
    and how do the validation METHODS themselves evolve as the corpus grows from tens to millions/billions of entities?'
  status: OPEN
  blocking: false
  blocking_impact: 'NOT an immediate precondition. This is a real open question about the meaning of canonical at
    scale, but it does not block current work: the corpus is a pilot (tens of entities), the gate is executable
    today, and the parts already ruled (PART 1 debt, PART 3 upgrade path) are implemented and enforced. The conditions
    this record describes — connection-incompleteness as the graph grows, and method cost at 10^6-10^9 entities
    — are conditions we cannot yet see from here. Owner ruling 2026-10-01: method change is probabilistic, not deterministic;
    change happens when the need becomes visible, and we cannot plan what we cannot see. Therefore this record is
    tracked, not scheduled, and is NOT marked as a prerequisite for L5 or for corpus-scale claims at this time.'
  owner_reasoning_2026_10_01: 'Recorded verbatim from the owner: ''should connect predicate is hard, i cannot make
    decision now, i need to do some calculation before i make decision, keep it open for now. also tier threshold
    also need some time before i make decisions, these are real issues, connection in itself is hard question especially
    when entity grows and needs completion criteria. It is one of the things i am actively researching, keep it
    open as well. Debt clearing concept is just new for now, and since connection in itself is hard to master, debt
    clearance is as well. It is a revision really, addition, so schema also needs to be flexible here and it also
    needs time. Every decision needs time.'' Consequences for this record: (i) all four remaining items stay OPEN
    with no target date; (ii) debt clearance is a REVISION (an addition), so the schema must stay flexible there
    rather than being frozen now; (iii) no urgency framing is attached to any part.'
  live_observation_2026_10_01: 'Follow-on owner ruling the same day, feeding PART 2 empirically: ''for debt at this
    small scale, actually block it fully until it is updated and validated. At starting phases, i can handle it,
    lets see how much entity it takes for debt to cause problem.'' Encoded as ENF-STEMMA-HITL-002.pilot_scale_block
    {active:true, block_mode:full, relaxes_to:forward_only}. The gate now invalidates any reviewed record carrying
    outstanding debt, at pilot scale, so the corpus size at which full blocking becomes a burden can be measured
    directly. That measurement — not a guess made now — is the intended input to the PART 2 tier thresholds; relaxing
    the block back to forward_only is a one-value owner edit in the enforcement registry. No threshold is set here.'
  context: 'Owner observation 2026-10-01: ''the canonicalized entity can be upgraded specially in connection because
    in early entity addition, there might not be enough entity to have connection information but as entity gets
    added to millions to billions, all entities must get updated, and they must be validated as well by the validator,
    that means validating towards end or when entities becomes more is more difficult and methods will evolve as
    well along the way.'' The live corpus illustrates the seed of the problem: conn.000157 (force -> mass) was canonical-worthy
    only while both endpoints were canonical; the HITL ruling (UNRES-STEMMA-HITL-002) demoted the endpoints and
    the connection followed. Nothing in the protocol expressed that dependency as a *debt* — it was caught only
    because a validator rule happened to exist.'
  scope_parts:
  - 'PART 1 (revalidation debt): when entity E reaches canonical, record the corpus state (or graph state) at approval.
    As new entities arrive that should connect to E (same domain/subdomain, relation domain/range satisfied, etc.),
    E accrues explicit, trackable ''revalidation owed'' debt. E stays canonical but flagged. Debt must be cleared
    — or explicitly deferred by the owner with a recorded reason — before the next baseline. DECISION TAKEN (owner,
    2026-10-01): provisional canonical + revalidation debt, NOT auto-demote-on-new-entity (a single new entity must
    not cascade into thousands of demotions).'
  - 'PART 2 (method evolution): validation methods tier by corpus size, with declared thresholds (e.g. exhaustive
    per-entity below a threshold; sampled + statistical confidence above it; locality/graph-consistency based above
    a larger threshold). Which tier runs is a function of the measured corpus size and is recorded. The tier thresholds
    and definitions are themselves governed by ADR so they cannot drift silently. STATUS: OPEN (owner 2026-10-01)
    — the principle of tiered, ADR-governed methods is accepted in shape, but NO numeric thresholds are fixed and
    no tier ADR is written. Method change is probabilistic, not deterministic: it will be taken up when the need
    is visible, not planned in advance. Kept OPEN indefinitely.'
  - 'PART 3 (upgrade path): an entity canonicalized with no connections must have a defined route to gain connections
    and be re-validated without being demoted and re-created — i.e. an additive, supersede-don''t-edit-compatible
    promotion of its connection-completeness, with the new connections themselves HITL-reviewed. DECISION TAKEN
    (owner, 2026-10-01): the upgrade path is additive via the promotion chain, no demotion or re-creation. What
    remains OPEN is the definition of connection-complete itself (see item (c) below).'
  what_is_NOT_decided: 'PART 1 (debt data model): RULED 2026-10-01 — debt lives in record frontmatter (revalidation_debt),
    visible to the gate, enforced per ADR-0057; implemented (EVID-STEMMA-HITL-009/010). PART 3 (upgrade path): RULED
    — additive; an entity gains connection-completeness through the promotion chain without demotion or re-creation.
    STILL OPEN — all four explicitly kept OPEN by owner ruling 2026-10-01, no target date, no urgency: (a) the exact
    should-connect predicate (candidate generation at scale; naive all-pairs is O(N^2)) — owner needs calculation
    before deciding; (b) the numeric tier thresholds for PART 2 (method evolution) — fixing a number now would violate
    the principle that change happens when the need is visible; (c) whether connection-complete is a per-entity
    boolean, a coverage ratio, or a graph-level invariant — connection completeness is itself hard, especially as
    entities grow, and is under active research; (d) how a debt-clearing edit interacts with supersede-don''t-edit
    — debt clearance is genuinely a REVISION (an addition), so the schema must remain flexible here and this needs
    time.'
  proposed_resolution: 'PART 1 and PART 3 ruled and implemented 2026-10-01 (ADR-0057, REQ-STEMMA-HITL-003, EVID-STEMMA-HITL-009/010):
    revalidation debt is a frontmatter object on all canonical datasets, blocks forward promotion, and is surfaced
    by name during validation; the upgrade path is additive via the promotion chain. NO FURTHER WORK IS SCHEDULED
    on this record. The four remaining items (a) should-connect predicate, (b) PART 2 tier thresholds, (c) definition
