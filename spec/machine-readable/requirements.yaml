requirements:
  - id: REQ-STEMMA-CORE-001
    revision: 1
    title: Canonical locations only
    statement: "Canonical knowledge SHALL live only in content/, connections/, sources/; everything else is regenerable derived output or tooling."
    type: FUNCTIONAL
    origin: RECOVERED
    status: PROPOSED
    priority: P0
    normative_strength: SHALL
    rationale: "Consumers and agents must have one unambiguous source of truth; derived copies invite forked truth (architecture L6)."
    source: [EVID-STEMMA-GATE-003, EVID-STEMMA-CORE-001]
    validation_basis: [recovered_intent, implemented_behavior, governing_docs]
    validation_status: SUPPORTED
    acceptance_criteria:
      - "Consumers read the export (IFACE-STEMMA-EXP-001), never canonical markdown directly"
      - "Derived artifacts regenerate from canonical via the gate"
    verification_method: INSPECTION
    owner: Sajan
    approver: null
    parent: null
    dependencies: []
    related_spec: ["spec/SPECIFICATION.md#4.1"]
    related_adr: [ADR-0027, ADR-0044]
    related_implementation: ["scripts/validate.py"]
    related_verification: ["cmd: python3 scripts/validate.py"]
    history: []
    supersedes: null
  - id: REQ-STEMMA-CORE-002
    revision: 1
    title: Immutable stable identity
    statement: "Canonical IDs SHALL match the stemma: schema patterns and SHALL never be reused or reassigned; corrections are supersessions, never edits in place."
    type: DATA
    origin: RECOVERED
    status: PROPOSED
    priority: P0
    normative_strength: SHALL
    rationale: "Knowledge-graph consumers join on IDs; reuse silently corrupts meaning (L5)."
    source: [EVID-STEMMA-CORE-003]
    validation_basis: [recovered_intent, schema_contract]
    validation_status: SUPPORTED
    acceptance_criteria:
      - "concept/source schemas reject non-stemma IDs"
      - "check_id_immutability guards history: no deletion/rename across git history"
    verification_method: STATIC_ANALYSIS
    owner: Sajan
    approver: null
    parent: null
