    statement: "The export contract SHALL be versioned (export_version, currently 2.2.0) and evolve additively within a major version; the export SHALL carry relation-registry and vocabulary sidecars; entities that adopt or re-identify an external entity SHALL carry an explicit adopted-from provenance record in the export."
