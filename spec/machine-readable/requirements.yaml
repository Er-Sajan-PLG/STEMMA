  - id: REQ-STEMMA-HITL-003
    revision: 1
    title: Staged promotion chain with day-separated stages and visible revalidation debt
    statement: "No single act SHALL set a canonical record: a record SHALL be promoted only through the ordered chain validator -> independent_validator -> board, recorded in provenance.promotion_history, with consecutive stages performed on separate calendar days and by distinct humans (or under a named, time-boxed owner independence_waiver); and a record carrying revalidation_debt.status 'outstanding' SHALL NOT advance to any further promotion status. Applies to ALL canonical datasets, entities and connections alike."
    type: SECURITY
    origin: PROPOSED
    status: APPROVED
    priority: P0
    normative_strength: SHALL
    rationale: "Owner directive 2026-10-01: 'the validator is not the final canonicalizer, it will be verified by another validator and it will finally reach board where multiple validators will finally validate it'; 'real time gate the validation, do not let me validate, independent validate and board validate at the same time, keep 1 day time different and I cannot break it'; and 'revalidation must be on all datasets, not just on entities, all datasets including connection.' Three independent acts on one day by one person is a formality, not a review. The day-gap rule is recorded as machine-readable data (spec/machine-readable/enforcement_rules.yaml) rather than prose, so it cannot be waived by editing an ADR. The interim single-actor state is legal only when made visible via an owner-sanctioned independence_waiver (ADR-0057 §1a)."
    source: [EVID-STEMMA-HITL-009, EVID-STEMMA-HITL-010]
    validation_basis: [owner_directive, implemented_behavior, gate_enforcement, mutation_test]
    validation_status: SUPPORTED
    acceptance_criteria:
      - "validate.py fails when a record is canonical without a complete ordered 3-stage promotion_history"
      - "validate.py fails when consecutive stages share a calendar day (>=1 day required)"
      - "validate.py fails when a board stage names <2 humans without an owner independence_waiver"
      - "validate.py fails (or warns, naming the debt) when revalidation_debt.status is outstanding"
      - "review_entity.py advances exactly one stage and refuses a same-day second stage"
      - "every guard is mutation-tested: injected violation -> non-zero exit; restore -> zero"
      - "the day-gap value is read from spec/machine-readable/enforcement_rules.yaml; deleting the registry fails closed"
    verification_method: INTEGRATION_TEST
    owner: Sajan
    approver: human:curator.001
    approval_date: 2026-10-01
    parent: null
    dependencies: [REQ-STEMMA-HITL-001]
