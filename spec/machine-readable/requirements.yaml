    type: CONSTRAINT
    origin: RECOVERED
    status: PROPOSED
    priority: P0
    normative_strength: SHALL NOT
    rationale: "Vectors are model-specific, non-reviewable, non-time-invariant; canonical purity keeps human review meaningful (L6)."
    source: [EVID-STEMMA-SEC-002]
    validation_basis: [recovered_intent, ci_enforcement]
    validation_status: SUPPORTED
