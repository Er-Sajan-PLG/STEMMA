  - requirement: REQ-STEMMA-CORE-001
    method: INSPECTION
    status: VERIFIED
    verified_date: 2026-10-01
    evidence: [EVID-STEMMA-CORE-001, EVID-STEMMA-GATE-003, EVID-STEMMA-CORE-011, EVID-STEMMA-CORE-012]
    procedure: "Inspect validate.py canonical path set; confirm the consumer reads only the export. Strengthened with a rogue-file probe: place a well-formed entity OUTSIDE content/ and confirm it is ignored; then regenerate and confirm derived artifacts are byte-identical (no forked truth)."
    result: "PASS on both criteria. (1) Canonical locations are enforced, not just declared: validate.py fixes the set at CONTENT/CONNECTIONS/SOURCES (:55-57) and discovers via CONTENT.rglob('*.md') (:1225) + load_canonical_yaml_dir (:1262-1263); a rogue entity (stemma:phys.rogue-outside-canonical) placed at the repo root left entity_count at 9 and never appeared in the export. (2) Consumers read the export: the sole consumer (explorer) loads exports/knowledge.json through one loader (knowledge-export-loader.ts:61) and never canonical markdown; re-running the gate leaves exports/ and reports/ byte-identical. archive/ holds the only outside copies and is never read by the validator."
