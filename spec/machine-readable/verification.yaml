    procedure: "Inspect the CI freshness step; then execute it as a true integration test by mutating a committed derived artifact and observing the gate, followed by a positive control that regeneration restores it."
    result: "AC1 PASS. ci.yml:32-34 runs `git diff --exit-code -- exports reports || (echo FAIL; exit 1)` in the verify-knowledge-base job after the authoritative chain (:30); the same gate repeats at :283 and :301 and in release.yml:69. Executed as an integration test against the real artifacts: (negative control) both an appended entity and an edited existing entity in exports/knowledge.json → exit 1; (positive control) `python3 scripts/validate.py` regenerated the artifact and the diff returned to 0 with a clean tree. The gate is therefore non-vacuous AND a true freshness gate rather than a tautology — a green diff means the derived artifacts genuinely match the canonical layer."
