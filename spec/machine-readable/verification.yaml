    status: FAILED
    verified_date: 2026-10-01
    evidence: [EVID-STEMMA-HITL-001, EVID-STEMMA-HITL-002, EVID-STEMMA-HITL-003, EVID-STEMMA-HITL-004]
    procedure: "AC1: inspect the chain step and execute hitl_check exactly as the chain invokes it. AC2: read provenance.writer for every canonical entity from the derived export and cross-check against the agent registry. AC3: inspect the audit trail's repository-portability."
    result: "FAILED. AC1 — the step IS in the chain (scripts/verify_all.py:31, step 8) but is VACUOUS: `hitl_check.py --check-workflow` reports 'Candidates: 0 / Proposals: 0 / Human edits: 0' and exits 0 with 'nothing to check', auditing a git-ignored directory (.gitignore:10; `git ls-files workflow/` = 0). It asserts nothing about the 9 canonical entities. AC2 — VIOLATED: 6 of 9 entities are status=canonical with provenance.writer=llm:coding-agent.001 (conservation-energy, force, length, mass, newtons-second-law, time); only stemma:phys.metre is human-written. The requirement states canonical objects 'declare writer: human:*'. `hitl_check.py --all` independently returns exit 1 with '9/9 entities fail HITL'. No gate enforces this: validate.py's human-reviewer rule (check_connection_agents) applies only to connections/, never to content/. AC3 — audit evidence is not repository-portable (UNRES-STEMMA-HITL-001, workflow/ is git-ignored)."
  - requirement: REQ-STEMMA-HITL-002
