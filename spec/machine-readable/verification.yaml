  on all three then-UNVERIFIED requirements in one pass via
  spec/UNVERIFIED-DECISIONS.md. (1) EXP-004 AC2 CONFIRMED: the canonical-only
  consumer contract is intended, adopting the criterion that emptiness is
  exceptional — once any entity is canonical, a policy admitting it SHALL NOT
  yield an empty export. UNRES-STEMMA-EXP-001 CLOSED and EXP-004 -> VERIFIED.
  (2) OPS-002: a documented per-release audit is accepted as the measurement
  instrument and the trend now STARTS at v3.0.0 as its first data point; the
  requirement deliberately REMAINS UNVERIFIED until a second release completes
  the pair, and by a second-pass owner ruling it is now PARKED TO RELEASE TIME
  — no work on it before the next release, since that is the earliest moment a
  second data point can exist. EVID-STEMMA-OPS-004 is NOT promoted from
  INFERENCE to FACT. (3) INTEG-001: the owner ordered AC3 implemented
  (grounded AI chat with citations and refusal). AC3 was implemented
  (explorer/src/services/ grounded-chat.ts, grounded-chat-panel.ts) and
  verified by explorer/scripts/verify-grounded-chat.mjs — 35 PASS against the
  real export, with refusal and connection-citation sabotages each producing
  failures — so INTEG-001 -> VERIFIED (AC1/AC2/AC4 already held; the verifier
  is now a step in the CI explorer-build job). The executor executed the
  rulings and set only the status the owner authorized, per Constraint D
  (spec/ROLES_AND_AUTHORITY.md). Prior rounds: the two FAILED records HITL-001
  and HITL-002 became VERIFIED after UNRES-STEMMA-HITL-002 (HITL scope is ALL
  data; the 6 LLM-written canonical entities demoted; corpus now 1 canonical
  (metre) / 8 drafts); UNRES-STEMMA-HITL-001 (audit-trail portability) remains
  OPEN. EXP-003, CORE-004, EXP-002 and GATE-003 were repaired and re-verified.
  Closed: UNRES-STEMMA-GATE-001, UNRES-STEMMA-CORE-002, UNRES-STEMMA-HITL-002,
  UNRES-STEMMA-EXP-001.
