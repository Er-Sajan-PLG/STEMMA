    procedure: "AC1: inspect hitl_check's candidate_edited requirement AND audit the live trail for such an event."
    result: "FAILED. AC1 is IMPLEMENTED in the checker (hitl_check.py:12,56-60,139 requires a `candidate_edited` event attributed to a registered human) but is NOT SATISFIED by the live trail: workflow/audit/audit.jsonl holds 6 events (config_saved x2, document_uploaded, extraction_started, extraction_complete, candidates_generated) and ZERO `candidate_edited` events. Because the chain runs in --check-workflow mode over an empty (git-ignored) workflow/ directory, the unmet condition never surfaces in CI: the check is correct but unexercised. Blocked on UNRES-STEMMA-HITL-001 (trail portability) and on the owner's ruling for how existing entities are brought into compliance."
