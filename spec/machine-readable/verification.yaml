    evidence: [EVID-STEMMA-SCH-001, EVID-STEMMA-EXP-001, EVID-STEMMA-EXP-011, EVID-STEMMA-EXP-012, EVID-STEMMA-EXP-013]
    procedure: "Check export_version against schema/VERSION.yaml; assert relation_registry + vocabularies sidecars present and registry-coherent; run jsonschema Draft202012 validation of exports/knowledge.json; then exercise acceptance criterion 4 — inject a valid adopted_from into a real entity and confirm it survives validation AND appears in the export, then inject malformed variants and confirm rejection (mutation probe)."
    result: "PASS on all 4 criteria (after owner-directed implementation, ADR-0056). Criteria 1-3: export_version 2.2.0 == VERSION.yaml; sidecars present and coherent; jsonschema 0 errors. Criterion 4 NOW MET: `adopted_from` is declared in BOTH concept.schema.json and export.schema.json (closed objects), enforced by check_adopted_from() in validate.py (required external_id + closed relation enum + unknown-key rejection, mirroring check_historical), and projected into entities[]. A valid record on metre.md validated (exit 0) and appeared verbatim in exports/knowledge.json; relation='sort_of_ish' and a missing external_id each produced exit 1 with named errors. Additivity confirmed: exports/knowledge.json byte-identical after the change, so export_version correctly stays 2.2.0. Previously FAILED on criterion 4; implemented, not deferred."
