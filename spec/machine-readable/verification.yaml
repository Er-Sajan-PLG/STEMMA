# Canonical verification mapping — mirrors spec/VERIFICATION.md
# Status is UNVERIFIED until an execution is recorded, VERIFIED once one is and it passed.
verification_set_note: "Execution round 2026-10-01: 18 VERIFIED, 2 FAILED, 4 UNVERIFIED of 24. Methods are bindings-to-come after approval; pre-approval runs were EVIDENCE (EVID-STEMMA-GATE-002), not VERIFICATION. Earlier findings repaired and re-verified: REQ-STEMMA-CORE-004 (generality guard widened + mutation-tested), REQ-STEMMA-EXP-002 criterion 4 (adopted_from implemented, ADR-0056), REQ-STEMMA-GATE-003 (test-suite + all-green added to the required status checks, EVID-STEMMA-GATE-018). REQ-STEMMA-EXP-003 verified by executing the CI freshness gate as an integration test (mutation + regeneration control, EVID-STEMMA-EXP-014/015/016). NEW FAILED (round 3): REQ-STEMMA-HITL-001 and REQ-STEMMA-HITL-002 — the chain's hitl_check --check-workflow step audits an empty, git-ignored workflow/ directory and exits 0 with 'nothing to check', so it is vacuous over content/; 6 of 9 canonical entities declare provenance.writer=llm:coding-agent.001, contradicting HITL-001 AC2; hitl_check --all independently returns exit 1 with 9/9 failures. Routed as UNRES-STEMMA-HITL-002 (blocking, owner ruling required) and entangled with UNRES-STEMMA-HITL-001 (audit-trail portability). The 4 remaining UNVERIFIED (EXP-004, SEC-002, OPS-002, INTEG-001) are execution-owed or blocked on external preconditions. Closed: UNRES-STEMMA-GATE-001, UNRES-STEMMA-CORE-002."
